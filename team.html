<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>五重戰隊</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --page-bg: #fffdf8;
      --ink: #25211c;
      --muted: #807363;
      --primary: #ff9f1c;
      --primary-strong: #f18a00;
      --primary-soft: #fff0cf;
      --tab-height: 72px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--page-bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 225, 166, 0.30), transparent 36%),
        radial-gradient(circle at 88% 6%, rgba(255, 243, 205, 0.26), transparent 32%),
        linear-gradient(180deg, #fffaf0 0%, #fffdf8 48%, #ffffff 100%);
    }

    button {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    body.sheet-open {
      overflow: hidden;
    }

    .app-shell {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: calc(var(--tab-height) + 24px + env(safe-area-inset-bottom));
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: calc(10px + env(safe-area-inset-top)) 20px 10px;
      background: rgba(255, 255, 253, 0.84);
      border-bottom: 1px solid rgba(246, 221, 178, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .brand-icon {
      font-size: 16px;
      line-height: 1;
    }

    .content {
      padding: 18px 20px 0;
    }

    .page-subtitle {
      margin: 0 0 18px;
      max-width: 320px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 560;
      line-height: 1.55;
    }

    .page-title {
      margin: 0 0 8px;
      color: #33281d;
      font-size: 28px;
      font-weight: 850;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .team-loading {
      display: grid;
      place-items: center;
      min-height: 280px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .team-loading-inner {
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    .team-loading-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 159, 28, 0.18);
      border-top-color: var(--primary-strong);
      border-radius: 50%;
      animation: spin 0.78s linear infinite;
    }

    .team-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: calc(100% - 40px);
      max-width: 440px;
      margin: 0 auto;
      padding: 36px 24px 28px;
      border: 1px solid rgba(246, 221, 178, 0.82);
      border-radius: 28px;
      background: rgba(255, 254, 249, 0.92);
      box-shadow: 0 12px 32px rgba(185, 117, 32, 0.1);
    }

    .empty-illustration {
      position: relative;
      width: min(100%, 200px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin-bottom: 28px;
    }

    .empty-illustration img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .empty-title {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.35;
      text-align: center;
      color: #25211c;
    }

    .empty-desc {
      margin: 0 0 36px;
      max-width: 300px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 560;
      line-height: 1.65;
      text-align: center;
    }

    .team-actions {
      display: grid;
      gap: 16px;
      width: 100%;
    }

    .team-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 64px;
      padding: 8px 20px;
      border: 0;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .team-button:active {
      transform: scale(0.985);
    }

    .team-button-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fffdf7;
      box-shadow: 0 4px 12px rgba(185, 117, 32, 0.12);
    }

    .team-button-icon svg {
      width: 18px;
      height: 18px;
    }

    .team-button-label {
      flex: 0 0 auto;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }

    .team-button.primary {
      color: #ffffff;
      background: linear-gradient(135deg, #ffb547 0%, #ff9f1c 52%, #ffac2f 100%);
      box-shadow: 0 14px 28px rgba(255, 159, 28, 0.28);
    }

    .team-button.primary .team-button-icon svg {
      color: var(--primary-strong);
    }

    .team-button.secondary {
      color: var(--primary-strong);
      background: linear-gradient(180deg, #fff4dd 0%, #ffe4ac 100%);
      box-shadow: 0 8px 20px rgba(255, 159, 28, 0.08);
    }

    .team-button.secondary .team-button-icon svg {
      color: var(--primary-strong);
    }

    .joined-team {
      display: grid;
      gap: 22px;
    }

    .team-summary-card {
      padding: 24px;
      border: 1px solid rgba(244, 218, 180, 0.86);
      border-radius: 28px;
      background: rgba(255, 254, 249, 0.92);
      box-shadow: 0 18px 40px rgba(185, 117, 32, 0.12);
    }

    .team-summary-top {
      display: grid;
      gap: 18px;
    }

    .team-heading {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .team-house img {
      display: block;
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .team-name {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: #33281d;
      font-size: 25px;
      font-weight: 850;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-heading-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .team-icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #9a8b78;
      background: rgba(255, 244, 222, 0.9);
      cursor: pointer;
      transition: transform 0.14s ease, background-color 0.14s ease, color 0.14s ease;
    }

    .team-icon-button:active {
      transform: scale(0.94);
    }

    .team-icon-button:disabled {
      cursor: default;
      opacity: 0.55;
    }

    .team-icon-button svg {
      display: block;
      width: 18px;
      height: 18px;
    }

    .invite-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .invite-label {
      color: #807363;
      font-size: 15px;
      font-weight: 750;
      white-space: nowrap;
    }

    .invite-code {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      color: var(--primary-strong);
      background: linear-gradient(180deg, #fff8e9 0%, #fff0cf 100%);
      font-size: 19px;
      font-weight: 850;
      letter-spacing: 0.02em;
    }

    .copy-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 42px;
      padding: 0 13px;
      border: 1px solid rgba(255, 159, 28, 0.32);
      border-radius: 12px;
      color: var(--primary-strong);
      background: rgba(255, 254, 249, 0.78);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .copy-button svg {
      width: 17px;
      height: 17px;
    }

    .team-divider {
      height: 1px;
      margin: 22px 0;
      background: linear-gradient(90deg, transparent 0%, rgba(222, 162, 74, 0.28) 12%, rgba(222, 162, 74, 0.28) 88%, transparent 100%);
    }

    .team-total-list {
      display: grid;
      gap: 14px;
    }

    .team-summary-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .team-total-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #807363;
      font-size: 16px;
      font-weight: 750;
    }

    .team-total-label svg,
    .member-count svg {
      width: 24px;
      height: 24px;
      color: #ffa21d;
    }

    .team-total-value {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      color: #7f6d58;
      font-size: 18px;
      font-weight: 850;
      white-space: nowrap;
    }

    .team-total-number {
      color: #f18a00;
      font-size: 34px;
      line-height: 1;
    }

    .members-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .member-period-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(246, 221, 178, 0.86);
    }

    .member-period-tab {
      min-height: 36px;
      border: 0;
      border-radius: 999px;
      color: #807363;
      background: transparent;
      font-size: 14px;
      font-weight: 850;
      cursor: pointer;
      transition: background-color 0.16s ease, box-shadow 0.16s ease, color 0.16s ease;
    }

    .member-period-tab.is-active {
      color: var(--primary-strong);
      background: #fffdf7;
      box-shadow: 0 6px 16px rgba(185, 117, 32, 0.1);
    }

    .members-title {
      margin: 0;
      color: #33281d;
      font-size: 18px;
      font-weight: 850;
    }

    .member-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #807363;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .member-list {
      display: grid;
      gap: 14px;
    }

    .member-card {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      min-height: 84px;
      padding: 13px 18px;
      border-radius: 24px;
      background: rgba(255, 255, 252, 0.98);
      box-shadow: 0 12px 28px rgba(185, 117, 32, 0.055);
    }

    .member-avatar {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #fff0cf;
    }

    .member-avatar img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .member-name {
      min-width: 0;
      overflow: hidden;
      color: #33281d;
      font-size: 17px;
      font-weight: 850;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .member-total {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      color: #807363;
      font-size: 15px;
      font-weight: 750;
      white-space: nowrap;
    }

    .member-total-number {
      color: #f18a00;
      font-size: 24px;
      font-weight: 900;
    }

    .tab-bar {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 30;
      width: min(100%, 480px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      min-height: var(--tab-height);
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(246, 221, 178, 0.64);
      border-radius: 24px 24px 0 0;
      background: rgba(255, 255, 252, 0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 -10px 30px rgba(185, 117, 32, 0.055);
    }

    .tab-item {
      position: relative;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 4px;
      min-height: 54px;
      padding-top: 6px;
      color: #a89576;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
    }

    .tab-item.is-active {
      color: var(--primary-strong);
    }

    .tab-item.is-active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 28px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffb547, #ffac2f);
      transform: translateX(-50%);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--tab-height) + 24px + env(safe-area-inset-bottom));
      z-index: 120;
      max-width: calc(100% - 40px);
      padding: 11px 16px;
      border-radius: 999px;
      color: #ffffff;
      background: rgba(69, 51, 32, 0.92);
      box-shadow: 0 12px 28px rgba(69, 51, 32, 0.18);
      font-size: 14px;
      font-weight: 750;
      line-height: 1.35;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.error {
      background: rgba(198, 70, 91, 0.94);
    }

    .blocking-loading {
      position: fixed;
      inset: 0;
      z-index: 180;
      display: grid;
      place-items: center;
      background: rgba(247, 248, 255, 0.56);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .blocking-loading-panel {
      display: grid;
      justify-items: center;
      gap: 12px;
      min-width: 132px;
      padding: 22px 24px;
      border: 1px solid rgba(244, 218, 180, 0.78);
      border-radius: 24px;
      color: #7f6d58;
      background: rgba(255, 254, 249, 0.92);
      box-shadow: 0 18px 42px rgba(185, 117, 32, 0.16);
      font-size: 14px;
      font-weight: 800;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      align-items: end;
      justify-items: center;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      border: 0;
      background-color: rgba(22, 28, 45, 0);
      cursor: pointer;
      transition: background-color 0.28s ease;
    }

    .sheet-overlay.is-open .sheet-backdrop {
      background-color: rgba(22, 28, 45, 0.48);
    }

    .bottom-sheet {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: min(100%, 480px);
      max-height: min(38vh, 380px);
      border-radius: 36px 36px 0 0;
      background: #fffdf7;
      box-shadow: 0 -18px 48px rgba(69, 51, 32, 0.18);
      transform: translate3d(0, calc(-1 * var(--sheet-keyboard-offset, 0px)), 0);
      transition:
        transform 0.34s cubic-bezier(0.22, 1, 0.36, 1),
        max-height 0.24s ease;
      will-change: transform;
    }

    .bottom-sheet.is-keyboard-open {
      max-height: min(40vh, 360px);
      overscroll-behavior: none;
      touch-action: none;
    }

    .sheet-handle {
      flex: 0 0 auto;
      width: 52px;
      height: 5px;
      margin: 15px auto 0;
      border-radius: 999px;
      background: #efd5aa;
    }

    .sheet-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 22px 24px 0;
      -webkit-overflow-scrolling: touch;
    }

    .sheet-title {
      margin: 0 0 20px;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.18;
      text-align: center;
      color: #25211c;
    }

    .sheet-desc {
      margin: 0 0 22px;
      color: #7f6d58;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.6;
    }

    .sheet-label {
      display: block;
      margin-bottom: 10px;
      color: #25211c;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }

    .sheet-input-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 0 16px;
      border: 1.5px solid #ff9f1c;
      border-radius: 16px;
      background: #fffdf7;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .sheet-input-wrap:focus-within {
      border-color: #f18a00;
      box-shadow: 0 0 0 3px rgba(255, 159, 28, 0.14);
    }

    .sheet-input-wrap.has-error {
      border-color: #e2556d;
      box-shadow: 0 0 0 3px rgba(226, 85, 109, 0.12);
    }

    .sheet-input-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      color: var(--primary-strong);
    }

    .sheet-input-icon svg {
      width: 22px;
      height: 22px;
    }

    .sheet-input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #25211c;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.4;
      outline: none;
    }

    .sheet-input::placeholder {
      color: #a89271;
      font-weight: 500;
    }

    .sheet-helper {
      margin: 11px 0 0;
      color: #9a8b78;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
    }

    .sheet-helper.is-error {
      color: #e2556d;
    }

    .sheet-footer {
      flex: 0 0 auto;
      padding: 20px 24px calc(10px + env(safe-area-inset-bottom));
    }

    .sheet-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 64px;
      padding: 0 20px;
      border: 0;
      border-radius: 18px;
      color: #ffffff;
      background: linear-gradient(135deg, #ffb547 0%, #ff9f1c 52%, #ffac2f 100%);
      box-shadow: 0 14px 28px rgba(255, 159, 28, 0.28);
      font-size: 21px;
      font-weight: 800;
      line-height: 1.2;
      cursor: pointer;
      transition: transform 0.14s ease;
    }

    .sheet-submit:active {
      transform: scale(0.985);
    }

    .bottom-sheet.is-keyboard-open .sheet-handle {
      margin-top: 12px;
    }

    .bottom-sheet.is-keyboard-open .sheet-body {
      overflow: hidden;
      padding-top: 16px;
      touch-action: none;
    }

    .bottom-sheet.is-keyboard-open .sheet-title {
      margin-bottom: 14px;
      font-size: 21px;
    }

    .bottom-sheet.is-keyboard-open .sheet-input-wrap {
      min-height: 58px;
    }

    .bottom-sheet.is-keyboard-open .sheet-helper {
      margin-top: 8px;
      font-size: 13px;
    }

    .bottom-sheet.is-keyboard-open .sheet-footer {
      padding-top: 14px;
      padding-bottom: 14px;
    }

    .bottom-sheet.is-keyboard-open .sheet-submit {
      min-height: 56px;
      font-size: 19px;
    }

    @media (max-width: 374px) {
      .app-header,
      .content {
        padding-left: 16px;
        padding-right: 16px;
      }

      .team-panel {
        width: calc(100% - 36px);
        padding: 30px 18px 24px;
      }

      .team-summary-card {
        padding: 20px 16px;
      }

      .team-house img {
        width: 36px;
        height: 36px;
      }

      .invite-row {
        grid-template-columns: 1fr auto;
      }

      .invite-label {
        grid-column: 1 / -1;
      }

      .member-card {
        grid-template-columns: 50px minmax(0, 1fr);
      }

      .member-avatar {
        width: 50px;
        height: 50px;
      }

      .member-total {
        grid-column: 2;
        justify-self: start;
      }

      .sheet-body,
      .sheet-footer {
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand" aria-label="五重戰隊">
        <span>五重戰隊</span>
        <span class="brand-icon" aria-hidden="true">✨</span>
      </div>
    </header>

    <div class="content">
      <section class="team-loading" id="teamLoading" aria-label="小隊資料載入中">
        <div class="team-loading-inner">
          <span class="team-loading-spinner" aria-hidden="true"></span>
          <span>載入小隊資料中...</span>
        </div>
      </section>

      <section id="emptyTeamState" hidden>
        <p class="page-subtitle">和夥伴一起打卡，完成五重祝福！</p>

        <div class="team-panel" aria-label="尚未加入戰隊">
          <div class="empty-illustration" aria-hidden="true">
            <img src="assets/five-blessings-icons/team_icon.png" alt="" />
          </div>

          <h2 class="empty-title">還沒有加入戰隊</h2>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    const LIFF_ID = '2010462217-tVZRATTG';
    const TEAM_API_URL = '/api/team';

    const sheetConfigs = {
      create: {
        overlay: document.getElementById('createTeamOverlay'),
        sheet: document.getElementById('createTeamSheet'),
        input: document.getElementById('teamNameInput'),
        helper: document.getElementById('teamNameHelper'),
        submitButton: document.getElementById('createTeamSubmit'),
        openButton: document.getElementById('openCreateTeamSheet'),
        defaultHelper: '建立後將自動加入此戰隊',
        loadingLabel: '建立中...',
        submitLabel: '建立戰隊'
      },
      edit: {
        overlay: document.getElementById('editTeamOverlay'),
        sheet: document.getElementById('editTeamSheet'),
        input: document.getElementById('editTeamNameInput'),
        helper: document.getElementById('editTeamNameHelper'),
        submitButton: document.getElementById('editTeamSubmit'),
        openButton: document.getElementById('openEditTeamSheet'),
        defaultHelper: '更新後小隊成員都會看到新名稱',
        loadingLabel: '儲存中...',
        submitLabel: '儲存名稱'
      },
      join: {
        overlay: document.getElementById('joinTeamOverlay'),
        sheet: document.getElementById('joinTeamSheet'),
        input: document.getElementById('inviteCodeInput'),
        helper: document.getElementById('inviteCodeHelper'),
        submitButton: document.getElementById('joinTeamSubmit'),
        openButton: document.getElementById('openJoinTeamSheet'),
        defaultHelper: '向戰隊成員索取邀請碼',
        loadingLabel: '加入中...',
        submitLabel: '加入戰隊'
      }
    };

    let activeSheetKey = null;
    let keyboardUpdateFrame = null;
    let idToken = null;
    let currentInviteCode = '';
    let currentTeamName = '';
    let currentMembers = [];
    let selectedMemberPeriod = 'week';
    let toastTimer = null;

    const teamLoadingEl = document.getElementById('teamLoading');
    const emptyTeamStateEl = document.getElementById('emptyTeamState');
    const joinedTeamStateEl = document.getElementById('joinedTeamState');
    const joinedTeamNameEl = document.getElementById('joinedTeamName');
    const joinedInviteCodeEl = document.getElementById('joinedInviteCode');
    const joinedWeeklyTotalEl = document.getElementById('joinedWeeklyTotal');
    const joinedMonthlyTotalEl = document.getElementById('joinedMonthlyTotal');
    const joinedMonthlyLabelEl = document.getElementById('joinedMonthlyLabel');
    const joinedMemberCountEl = document.getElementById('joinedMemberCount');
    const membersPeriodTitleEl = document.getElementById('membersPeriodTitle');
    const memberListEl = document.getElementById('memberList');
    const memberPeriodTabs = Array.from(document.querySelectorAll('[data-member-period]'));
    const copyInviteButton = document.getElementById('copyInviteCode');
    const copyInviteLabel = document.getElementById('copyInviteLabel');
    const leaveTeamButton = document.getElementById('leaveTeamButton');
    const toastEl = document.getElementById('toast');
    const blockingLoadingEl = document.getElementById('blockingLoading');
    const blockingLoadingTextEl = document.getElementById('blockingLoadingText');

    function focusSheetInput(input) {
      input.focus({ preventScroll: true });

      const end = input.value.length;
      if (typeof input.setSelectionRange === 'function') {
        input.setSelectionRange(end, end);
      }
    }

    function openTeamSheet(key) {
      const config = sheetConfigs[key];
      if (!config) return;

      closeTeamSheet(activeSheetKey);
      resetSheetFeedback(config);

      activeSheetKey = key;
      if (key === 'edit') {
        config.input.value = currentTeamName;
      }
      config.overlay.hidden = false;
      document.body.classList.add('sheet-open');
      void config.overlay.offsetHeight;
      updateSheetKeyboardOffset();
      focusSheetInput(config.input);

      requestAnimationFrame(() => {
        config.overlay.classList.add('is-open');
        requestAnimationFrame(() => focusSheetInput(config.input));
      });
    }

    function closeTeamSheet(key) {
      const config = sheetConfigs[key];
      if (!config || config.overlay.hidden) return;

      hideTeamSheet(config);

      if (activeSheetKey === key) {
        activeSheetKey = null;
      }

      const hasOpenSheet = Object.values(sheetConfigs).some(item => !item.overlay.hidden);
      if (!hasOpenSheet) {
        document.body.classList.remove('sheet-open');
      }
    }

    function hideTeamSheet(config) {
      config.overlay.classList.remove('is-open');
      config.overlay.hidden = true;
      config.sheet.classList.remove('is-keyboard-open');
      config.sheet.style.removeProperty('--sheet-keyboard-offset');
      config.input.blur();
    }

    async function submitTeamAction(key) {
      const config = sheetConfigs[key];
      if (!config || config.submitButton.disabled) return;

      if (!idToken) {
        setSheetError(config, '尚未完成 LINE 登入，請重新開啟頁面。');
        return;
      }

      const value = config.input.value.trim();

      if (!value) {
        setSheetError(config, key === 'join' ? '請輸入邀請碼' : '請輸入戰隊名稱');
        return;
      }

      setSheetLoading(config, true);
      resetSheetFeedback(config);
      showBlockingLoading(getTeamActionLoadingMessage(key));

      try {
        const data = await requestTeam(getTeamActionPayload(key, value));

        if (!data.team) {
          throw new Error('Missing team summary');
        }

        config.input.value = '';
        renderTeamSummary(data);
        hideTeamSheet(config);
        activeSheetKey = null;
        document.body.classList.remove('sheet-open');
        showToast(getTeamActionSuccessMessage(key), 'success');
      } catch (error) {
        setSheetError(config, getTeamActionErrorMessage(key, error));
      } finally {
        setSheetLoading(config, false);
        hideBlockingLoading();
      }
    }

    function getTeamActionPayload(key, value) {
      if (key === 'create') {
        return { action: 'create', name: value };
      }

      if (key === 'edit') {
        return { action: 'rename', name: value };
      }

      return { action: 'join', inviteCode: value };
    }

    function getTeamActionLoadingMessage(key) {
      if (key === 'create') return '建立戰隊中...';
      if (key === 'edit') return '儲存名稱中...';
      return '加入戰隊中...';
    }

    function getTeamActionSuccessMessage(key) {
      if (key === 'create') return '戰隊建立成功！';
      if (key === 'edit') return '戰隊名稱已更新！';
      return '加入戰隊成功！';
    }

    function getTeamActionErrorMessage(key, error) {
      if (key === 'join' && error.statusCode === 404) {
        return '找不到這組邀請碼';
      }

      if (key === 'create') {
        return '建立戰隊失敗，請再試一次。';
      }

      if (key === 'edit') {
        return '更新名稱失敗，請再試一次。';
      }

      return '找不到這組邀請碼，請確認後再試一次。';
    }

    async function requestTeam(payload) {
      const response = await fetch(TEAM_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          idToken,
          ...payload
        })
      });
      const data = await parseJsonResponse(response);

      if (!response.ok || !data.success) {
        const error = new Error(data.error || 'Team API failed');
        error.statusCode = response.status;
        throw error;
      }

      return data;
    }

    async function parseJsonResponse(response) {
      const text = await response.text();

      try {
        return JSON.parse(text || '{}');
      } catch (error) {
        return {
          success: false,
          error: text || 'Invalid API response'
        };
      }
    }

    function setSheetLoading(config, isLoading) {
      config.submitButton.disabled = isLoading;
      config.submitButton.textContent = isLoading ? config.loadingLabel : config.submitLabel;
    }

    function setSheetError(config, message) {
      config.helper.textContent = message;
      config.helper.classList.add('is-error');
      config.input.parentElement.classList.add('has-error');
    }

    function resetSheetFeedback(config) {
      config.helper.textContent = config.defaultHelper;
      config.helper.classList.remove('is-error');
      config.input.parentElement.classList.remove('has-error');
    }

    function showLoadingState() {
      teamLoadingEl.hidden = false;
      emptyTeamStateEl.hidden = true;
      joinedTeamStateEl.hidden = true;
    }

    function showBlockingLoading(message) {
      blockingLoadingTextEl.textContent = message || '資料處理中...';
      blockingLoadingEl.hidden = false;
    }

    function hideBlockingLoading() {
      blockingLoadingEl.hidden = true;
    }

    function showEmptyState() {
      teamLoadingEl.hidden = true;
      emptyTeamStateEl.hidden = false;
      joinedTeamStateEl.hidden = true;
    }

    function renderTeamSummary(data) {
      if (!data || !data.team) {
        currentTeamName = '';
        showEmptyState();
        return;
      }

      currentInviteCode = data.team.inviteCode || '';
      currentTeamName = data.team.name || '我的小隊';
      teamLoadingEl.hidden = true;
      emptyTeamStateEl.hidden = true;
      joinedTeamStateEl.hidden = false;

      joinedTeamNameEl.textContent = currentTeamName;
      joinedInviteCodeEl.textContent = currentInviteCode || '------';
      joinedWeeklyTotalEl.textContent = Number(data.weeklyTotal || 0);
      joinedMonthlyTotalEl.textContent = Number(data.monthlyTotal || 0);
      joinedMonthlyLabelEl.textContent = data.monthlyLabel || '本月';

      currentMembers = Array.isArray(data.members) ? data.members : [];
      joinedMemberCountEl.textContent = `${currentMembers.length} 位成員`;
      setMemberPeriod('week');
    }

    function setMemberPeriod(period) {
      selectedMemberPeriod = period === 'month' ? 'month' : 'week';
      membersPeriodTitleEl.textContent = selectedMemberPeriod === 'month'
        ? '小隊成員本月累積'
        : '小隊成員本週累積';
      memberPeriodTabs.forEach(tab => {
        const isActive = tab.dataset.memberPeriod === selectedMemberPeriod;
        tab.classList.toggle('is-active', isActive);
        tab.setAttribute('aria-selected', String(isActive));
      });
      renderMemberList();
    }

    function renderMemberList() {
      memberListEl.innerHTML = currentMembers
        .map((member, index) => renderMemberCard(member, index))
        .join('');
    }

    function renderMemberCard(member, index) {
      const displayName = escapeHtml(member.displayName || '小隊成員');
      const total = selectedMemberPeriod === 'month'
        ? Number(member.monthlyTotal || 0)
        : Number(member.weeklyTotal || 0);
      const periodLabel = selectedMemberPeriod === 'month' ? '本月累積' : '本週累積';
      const avatarSrc = member.pictureUrl || buildFallbackAvatar(member.id || displayName, index);

      return `
        <article class="member-card">
          <div class="member-avatar" aria-hidden="true">
            <img src="${escapeAttribute(avatarSrc)}" alt="" />
          </div>
          <div class="member-name">${displayName}</div>
          <div class="member-total">
            <span>${periodLabel}</span>
            <span class="member-total-number">${total}</span>
            <span>次</span>
          </div>
        </article>
      `;
    }

    function buildFallbackAvatar(seed, index) {
      const palette = [
        ['#fff1d3', '#ffc15a', '#fffdf7'],
        ['#fff4dd', '#ffc35d', '#fffdf7'],
        ['#fff0d1', '#ffb160', '#fffdf7'],
        ['#fff4dd', '#ffad2e', '#fffdf7']
      ][index % 4];
      const initials = String(seed || '?').trim().slice(0, 1).toUpperCase() || '?';

      return 'data:image/svg+xml;utf8,' + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
              <stop stop-color="${palette[0]}"/>
              <stop offset="1" stop-color="${palette[1]}"/>
            </linearGradient>
          </defs>
          <rect width="80" height="80" rx="40" fill="url(#g)"/>
          <circle cx="40" cy="31" r="14" fill="${palette[2]}" opacity=".9"/>
          <path d="M17 70c4-16 14-24 23-24s19 8 23 24" fill="${palette[2]}" opacity=".9"/>
          <text x="40" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#f18a00">${escapeSvgText(initials)}</text>
        </svg>
      `);
    }

    async function copyInviteCode() {
      if (!currentInviteCode) return;

      try {
        await navigator.clipboard.writeText(currentInviteCode);
        copyInviteLabel.textContent = '已複製';
        showToast('邀請碼已複製', 'success');

        window.setTimeout(() => {
          copyInviteLabel.textContent = '複製';
        }, 1600);
      } catch (error) {
        showToast('複製失敗，請手動選取邀請碼。', 'error');
      }
    }

    async function leaveTeam() {
      if (!idToken || leaveTeamButton.disabled) {
        return;
      }

      const confirmed = window.confirm('確定要退出目前的小隊嗎？');
      if (!confirmed) {
        return;
      }

      leaveTeamButton.disabled = true;
      showBlockingLoading('退出小隊中...');

      try {
        await requestTeam({ action: 'leave' });
        currentInviteCode = '';
        currentTeamName = '';
        currentMembers = [];
        memberListEl.innerHTML = '';
        showEmptyState();
        showToast('已退出小隊', 'success');
      } catch (error) {
        showToast('退出小隊失敗，請稍後再試。', 'error');
      } finally {
        leaveTeamButton.disabled = false;
        hideBlockingLoading();
      }
    }

    function showToast(message, type) {
      window.clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.classList.toggle('error', type === 'error');
      toastEl.classList.add('show');

      toastTimer = window.setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2400);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[character]);
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    function escapeSvgText(value) {
      return String(value).replace(/[&<>]/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;'
      })[character]);
    }

    function updateSheetKeyboardOffset() {
      if (!activeSheetKey || !window.visualViewport) {
        return;
      }

      const config = sheetConfigs[activeSheetKey];
      if (!config || config.overlay.hidden) {
        return;
      }

      const viewport = window.visualViewport;
      const keyboardOffset = Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop);
      const isKeyboardOpen = keyboardOffset > 80;
      const sheetOffset = keyboardOffset;
      const wasKeyboardOpen = config.sheet.classList.contains('is-keyboard-open');

      config.sheet.classList.toggle('is-keyboard-open', isKeyboardOpen);
      if (isKeyboardOpen) {
        config.sheet.style.setProperty('--sheet-keyboard-offset', `${sheetOffset}px`);
        return;
      }

      if (wasKeyboardOpen) {
        closeTeamSheet(activeSheetKey);
        return;
      }

      config.sheet.style.removeProperty('--sheet-keyboard-offset');
    }

    function scheduleSheetKeyboardOffsetUpdate() {
      if (keyboardUpdateFrame) {
        cancelAnimationFrame(keyboardUpdateFrame);
      }

      keyboardUpdateFrame = requestAnimationFrame(() => {
        keyboardUpdateFrame = null;
        updateSheetKeyboardOffset();
      });
    }

    function preventKeyboardSheetDrag(event) {
      const config = sheetConfigs[activeSheetKey];
      if (config && config.sheet.classList.contains('is-keyboard-open')) {
        event.preventDefault();
      }
    }

    sheetConfigs.create.openButton.addEventListener('click', () => openTeamSheet('create'));
    sheetConfigs.edit.openButton.addEventListener('click', () => openTeamSheet('edit'));
    sheetConfigs.join.openButton.addEventListener('click', () => openTeamSheet('join'));
    sheetConfigs.create.submitButton.addEventListener('click', () => submitTeamAction('create'));
    sheetConfigs.edit.submitButton.addEventListener('click', () => submitTeamAction('edit'));
    sheetConfigs.join.submitButton.addEventListener('click', () => submitTeamAction('join'));
    copyInviteButton.addEventListener('click', copyInviteCode);
    leaveTeamButton.addEventListener('click', leaveTeam);
    memberPeriodTabs.forEach(tab => {
      tab.addEventListener('click', () => setMemberPeriod(tab.dataset.memberPeriod));
    });

    document.querySelectorAll('[data-sheet-close]').forEach(element => {
      element.addEventListener('click', () => {
        closeTeamSheet(element.dataset.sheetClose);
      });
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleSheetKeyboardOffsetUpdate);
      window.visualViewport.addEventListener('scroll', scheduleSheetKeyboardOffsetUpdate);
    }

    Object.values(sheetConfigs).forEach(config => {
      config.sheet.addEventListener('touchmove', preventKeyboardSheetDrag, { passive: false });

      config.input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          submitTeamAction(activeSheetKey);
        }
      });
    });

    async function initTeamPage() {
      showLoadingState();

      if (!window.liff) {
        showEmptyState();
        showToast('LINE LIFF 尚未載入，請重新開啟頁面。', 'error');
        return;
      }

      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error('Missing LINE idToken');
        }

        const data = await requestTeam({ action: 'summary' });
        renderTeamSummary(data);
      } catch (error) {
        showEmptyState();
        showToast('讀取小隊資料失敗，請重新整理後再試一次。', 'error');
      }
    }

    initTeamPage();
  </script>
</body>
</html>
