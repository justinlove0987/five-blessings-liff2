<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>五重戰隊</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --page-bg: #f5f7ff;
      --ink: #1f2433;
      --muted: #7b849b;
      --primary: #6a7df8;
      --primary-strong: #5067ee;
      --primary-soft: #eef1ff;
      --tab-height: 72px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--page-bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(214, 207, 255, 0.5), transparent 36%),
        radial-gradient(circle at 88% 6%, rgba(202, 232, 255, 0.38), transparent 32%),
        linear-gradient(180deg, #f7f4ff 0%, #f4f8ff 48%, #fbfcff 100%);
    }

    button {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    body.sheet-open {
      overflow: hidden;
    }

    .app-shell {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: calc(var(--tab-height) + 24px + env(safe-area-inset-bottom));
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: calc(10px + env(safe-area-inset-top)) 20px 10px;
      background: rgba(255, 255, 255, 0.72);
      border-bottom: 1px solid rgba(232, 236, 248, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .brand-icon {
      font-size: 16px;
      line-height: 1;
    }

    .content {
      padding: 18px 20px 0;
    }

    .page-subtitle {
      margin: 0 0 18px;
      max-width: 320px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 560;
      line-height: 1.55;
    }

    .team-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: calc(100% - 40px);
      max-width: 440px;
      margin: 0 auto;
      padding: 36px 24px 28px;
      border: 1px solid rgba(232, 236, 248, 0.82);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 12px 32px rgba(83, 95, 143, 0.1);
    }

    .empty-illustration {
      position: relative;
      width: min(100%, 200px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin-bottom: 28px;
    }

    .empty-illustration img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .empty-title {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.35;
      text-align: center;
      color: #171b28;
    }

    .empty-desc {
      margin: 0 0 36px;
      max-width: 300px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 560;
      line-height: 1.65;
      text-align: center;
    }

    .team-actions {
      display: grid;
      gap: 16px;
      width: 100%;
    }

    .team-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 64px;
      padding: 8px 20px;
      border: 0;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .team-button:active {
      transform: scale(0.985);
    }

    .team-button-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(82, 95, 160, 0.12);
    }

    .team-button-icon svg {
      width: 18px;
      height: 18px;
    }

    .team-button-label {
      flex: 0 0 auto;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }

    .team-button.primary {
      color: #ffffff;
      background: linear-gradient(135deg, #6f82ff 0%, #7d6df4 52%, #8b67ee 100%);
      box-shadow: 0 14px 28px rgba(106, 125, 248, 0.28);
    }

    .team-button.primary .team-button-icon svg {
      color: var(--primary-strong);
    }

    .team-button.secondary {
      color: var(--primary-strong);
      background: linear-gradient(180deg, #f1f3ff 0%, #e9edff 100%);
      box-shadow: 0 8px 20px rgba(106, 125, 248, 0.08);
    }

    .team-button.secondary .team-button-icon svg {
      color: var(--primary-strong);
    }

    .tab-bar {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 30;
      width: min(100%, 480px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      min-height: var(--tab-height);
      padding: 8px 18px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(232, 236, 248, 0.9);
      border-radius: 24px 24px 0 0;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 -10px 30px rgba(83, 95, 143, 0.08);
    }

    .tab-item {
      position: relative;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 4px;
      min-height: 54px;
      padding-top: 6px;
      color: #9aa3b8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
    }

    .tab-item.is-active {
      color: var(--primary-strong);
    }

    .tab-item.is-active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 28px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #6f82ff, #8b67ee);
      transform: translateX(-50%);
    }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      align-items: end;
      justify-items: center;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      border: 0;
      background: rgba(22, 28, 45, 0.48);
      cursor: pointer;
    }

    .bottom-sheet {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: min(100%, 480px);
      max-height: min(38vh, 380px);
      border-radius: 36px 36px 0 0;
      background: #fcfdff;
      box-shadow: 0 -18px 48px rgba(38, 45, 70, 0.18);
      transform: translate3d(0, calc(-1 * var(--sheet-keyboard-offset, 0px)), 0);
      transition:
        transform 0.34s cubic-bezier(0.22, 1, 0.36, 1),
        max-height 0.24s ease;
      will-change: transform;
    }

    .bottom-sheet.is-keyboard-open {
      max-height: min(40vh, 360px);
    }

    .sheet-handle {
      flex: 0 0 auto;
      width: 52px;
      height: 5px;
      margin: 15px auto 0;
      border-radius: 999px;
      background: #d5d9ea;
    }

    .sheet-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 22px 24px 0;
      -webkit-overflow-scrolling: touch;
    }

    .sheet-title {
      margin: 0 0 20px;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.18;
      text-align: center;
      color: #171b28;
    }

    .sheet-desc {
      margin: 0 0 22px;
      color: #5d6787;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.6;
    }

    .sheet-label {
      display: block;
      margin-bottom: 10px;
      color: #171b28;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }

    .sheet-input-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 0 16px;
      border: 1.5px solid #6a7df8;
      border-radius: 16px;
      background: #ffffff;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .sheet-input-wrap:focus-within {
      border-color: #5067ee;
      box-shadow: 0 0 0 3px rgba(106, 125, 248, 0.14);
    }

    .sheet-input-wrap.has-error {
      border-color: #e2556d;
      box-shadow: 0 0 0 3px rgba(226, 85, 109, 0.12);
    }

    .sheet-input-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      color: var(--primary-strong);
    }

    .sheet-input-icon svg {
      width: 22px;
      height: 22px;
    }

    .sheet-input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #171b28;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.4;
      outline: none;
    }

    .sheet-input::placeholder {
      color: #a2aac0;
      font-weight: 500;
    }

    .sheet-helper {
      margin: 11px 0 0;
      color: #8a93aa;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
    }

    .sheet-helper.is-error {
      color: #e2556d;
    }

    .sheet-footer {
      flex: 0 0 auto;
      padding: 20px 24px calc(10px + env(safe-area-inset-bottom));
    }

    .sheet-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 64px;
      padding: 0 20px;
      border: 0;
      border-radius: 18px;
      color: #ffffff;
      background: linear-gradient(135deg, #6f82ff 0%, #7d6df4 52%, #8b67ee 100%);
      box-shadow: 0 14px 28px rgba(106, 125, 248, 0.28);
      font-size: 21px;
      font-weight: 800;
      line-height: 1.2;
      cursor: pointer;
      transition: transform 0.14s ease;
    }

    .sheet-submit:active {
      transform: scale(0.985);
    }

    .bottom-sheet.is-keyboard-open .sheet-handle {
      margin-top: 12px;
    }

    .bottom-sheet.is-keyboard-open .sheet-body {
      padding-top: 16px;
    }

    .bottom-sheet.is-keyboard-open .sheet-title {
      margin-bottom: 14px;
      font-size: 21px;
    }

    .bottom-sheet.is-keyboard-open .sheet-input-wrap {
      min-height: 58px;
    }

    .bottom-sheet.is-keyboard-open .sheet-helper {
      margin-top: 8px;
      font-size: 13px;
    }

    .bottom-sheet.is-keyboard-open .sheet-footer {
      padding-top: 14px;
      padding-bottom: 6px;
    }

    .bottom-sheet.is-keyboard-open .sheet-submit {
      min-height: 56px;
      font-size: 19px;
    }

    @media (max-width: 374px) {
      .app-header,
      .content {
        padding-left: 16px;
        padding-right: 16px;
      }

      .team-panel {
        width: calc(100% - 36px);
        padding: 30px 18px 24px;
      }

      .sheet-body,
      .sheet-footer {
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand" aria-label="五重戰隊">
        <span>五重戰隊</span>
        <span class="brand-icon" aria-hidden="true">✨</span>
      </div>
    </header>

    <div class="content">
      <p class="page-subtitle">和夥伴一起打卡，完成五重祝福！</p>

      <section class="team-panel" aria-label="尚未加入戰隊">
      <div class="empty-illustration" aria-hidden="true">
        <img src="assets/five-blessings-icons/team_icon.png" alt="" />
      </div>

      <h2 class="empty-title">還沒有加入戰隊</h2>
      <p class="empty-desc">建立或加入一個五重戰隊，和夥伴一起完成使命！</p>

      <div class="team-actions">
        <button class="team-button primary" type="button" id="openCreateTeamSheet">
          <span class="team-button-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
            </svg>
          </span>
          <span class="team-button-label">新增五重戰隊</span>
        </button>

        <button class="team-button secondary" type="button" id="openJoinTeamSheet">
          <span class="team-button-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M16 11h5M18.5 8.5v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
              <circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="2" />
              <path d="M3.5 18.5c.9-2.8 2.8-4.5 5.5-4.5s4.6 1.7 5.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </span>
          <span class="team-button-label">加入五重戰隊</span>
        </button>
      </div>
    </section>
    </div>
  </main>

  <nav class="tab-bar" aria-label="主要導覽">
    <a class="tab-item" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4.5 10.2 12 4.5l7.5 5.7V20a1 1 0 0 1-1 1h-5v-6H10.5v6h-5a1 1 0 0 1-1-1v-9.8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
      </svg>
      <span>首頁</span>
    </a>

    <a class="tab-item is-active" href="team.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3Zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3Zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13Zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5Z" />
      </svg>
      <span>五重戰隊</span>
    </a>
  </nav>

  <div class="sheet-overlay" id="createTeamOverlay" hidden>
    <button class="sheet-backdrop" type="button" aria-label="關閉新增戰隊視窗" data-sheet-close="create"></button>

    <section
      class="bottom-sheet"
      id="createTeamSheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="createTeamTitle"
    >
      <div class="sheet-handle" aria-hidden="true"></div>

      <div class="sheet-body">
        <h2 class="sheet-title" id="createTeamTitle">新增五重戰隊</h2>

        <label class="sheet-label" for="teamNameInput">戰隊名稱</label>

        <div class="sheet-input-wrap" id="teamNameInputWrap">
          <span class="sheet-input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3Zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3Zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13Zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5Z" />
            </svg>
          </span>
          <input
            class="sheet-input"
            id="teamNameInput"
            type="text"
            placeholder="請輸入戰隊名稱"
            autocomplete="off"
            enterkeyhint="done"
          />
        </div>

        <p class="sheet-helper" id="teamNameHelper">建立後將自動加入此戰隊</p>
      </div>

      <div class="sheet-footer">
        <button class="sheet-submit" type="button">建立戰隊</button>
      </div>
    </section>
  </div>

  <div class="sheet-overlay" id="joinTeamOverlay" hidden>
    <button class="sheet-backdrop" type="button" aria-label="關閉加入戰隊視窗" data-sheet-close="join"></button>

    <section
      class="bottom-sheet"
      id="joinTeamSheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="joinTeamTitle"
    >
      <div class="sheet-handle" aria-hidden="true"></div>

      <div class="sheet-body">
        <h2 class="sheet-title" id="joinTeamTitle">加入五重戰隊</h2>

        <label class="sheet-label" for="inviteCodeInput">邀請碼</label>

        <div class="sheet-input-wrap" id="inviteCodeInputWrap">
          <span class="sheet-input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58s1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z" />
            </svg>
          </span>
          <input
            class="sheet-input"
            id="inviteCodeInput"
            type="text"
            placeholder="請輸入邀請碼"
            autocomplete="off"
            autocapitalize="characters"
            enterkeyhint="done"
          />
        </div>

        <p class="sheet-helper" id="inviteCodeHelper">向戰隊成員索取邀請碼</p>
      </div>

      <div class="sheet-footer">
        <button class="sheet-submit" type="button">加入戰隊</button>
      </div>
    </section>
  </div>

  <script>
    const sheetConfigs = {
      create: {
        overlay: document.getElementById('createTeamOverlay'),
        sheet: document.getElementById('createTeamSheet'),
        input: document.getElementById('teamNameInput'),
        openButton: document.getElementById('openCreateTeamSheet')
      },
      join: {
        overlay: document.getElementById('joinTeamOverlay'),
        sheet: document.getElementById('joinTeamSheet'),
        input: document.getElementById('inviteCodeInput'),
        openButton: document.getElementById('openJoinTeamSheet')
      }
    };

    let activeSheetKey = null;
    let keyboardUpdateFrame = null;

    function focusSheetInput(input) {
      input.focus({ preventScroll: true });

      const end = input.value.length;
      if (typeof input.setSelectionRange === 'function') {
        input.setSelectionRange(end, end);
      }
    }

    function openTeamSheet(key) {
      const config = sheetConfigs[key];
      if (!config) return;

      closeTeamSheet(activeSheetKey);

      activeSheetKey = key;
      config.overlay.hidden = false;
      document.body.classList.add('sheet-open');
      updateSheetKeyboardOffset();
      focusSheetInput(config.input);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => focusSheetInput(config.input));
      });
    }

    function closeTeamSheet(key) {
      const config = sheetConfigs[key];
      if (!config || config.overlay.hidden) return;

      config.overlay.hidden = true;
      config.sheet.classList.remove('is-keyboard-open');
      config.sheet.style.removeProperty('--sheet-keyboard-offset');
      config.input.blur();

      if (activeSheetKey === key) {
        activeSheetKey = null;
      }

      const hasOpenSheet = Object.values(sheetConfigs).some(item => !item.overlay.hidden);
      if (!hasOpenSheet) {
        document.body.classList.remove('sheet-open');
      }
    }

    function updateSheetKeyboardOffset() {
      if (!activeSheetKey || !window.visualViewport) {
        return;
      }

      const config = sheetConfigs[activeSheetKey];
      if (!config || config.overlay.hidden) {
        return;
      }

      const viewport = window.visualViewport;
      const keyboardOffset = Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop);
      const isKeyboardOpen = keyboardOffset > 80;
      const inputAccessoryGap = 12;
      const sheetOffset = Math.max(0, keyboardOffset + inputAccessoryGap);
      const wasKeyboardOpen = config.sheet.classList.contains('is-keyboard-open');

      config.sheet.classList.toggle('is-keyboard-open', isKeyboardOpen);
      if (isKeyboardOpen) {
        config.sheet.style.setProperty('--sheet-keyboard-offset', `${sheetOffset}px`);
        return;
      }

      if (wasKeyboardOpen) {
        closeTeamSheet(activeSheetKey);
        return;
      }

      config.sheet.style.removeProperty('--sheet-keyboard-offset');
    }

    function scheduleSheetKeyboardOffsetUpdate() {
      if (keyboardUpdateFrame) {
        cancelAnimationFrame(keyboardUpdateFrame);
      }

      keyboardUpdateFrame = requestAnimationFrame(() => {
        keyboardUpdateFrame = null;
        updateSheetKeyboardOffset();
      });
    }

    sheetConfigs.create.openButton.addEventListener('click', () => openTeamSheet('create'));
    sheetConfigs.join.openButton.addEventListener('click', () => openTeamSheet('join'));

    document.querySelectorAll('[data-sheet-close]').forEach(element => {
      element.addEventListener('click', () => {
        closeTeamSheet(element.dataset.sheetClose);
      });
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleSheetKeyboardOffsetUpdate);
      window.visualViewport.addEventListener('scroll', scheduleSheetKeyboardOffsetUpdate);
    }

    Object.values(sheetConfigs).forEach(config => {
      config.input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          closeTeamSheet(activeSheetKey);
        }
      });
    });
  </script>
</body>
</html>
