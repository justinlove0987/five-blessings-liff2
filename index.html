<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>五重祝福打卡</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --page-bg: #fffaf0;
      --card: #fffef9;
      --ink: #30251a;
      --muted: #8d7b66;
      --line: #f3dfbd;
      --primary: #f3b34f;
      --primary-strong: #d8872b;
      --success: #efb24f;
      --success-soft: #fff7e7;
      --shadow: 0 10px 28px rgba(174, 116, 45, 0.12);
      --tab-height: 72px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--page-bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 10% 14%, rgba(255, 229, 181, 0.68), transparent 34%),
        radial-gradient(circle at 90% 5%, rgba(255, 244, 209, 0.58), transparent 30%),
        linear-gradient(180deg, #fff4df 0%, #fff9ed 42%, #fffef9 100%);
    }

    button {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .app-shell {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: calc(var(--tab-height) + 24px + env(safe-area-inset-bottom));
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: calc(10px + env(safe-area-inset-top)) 20px 10px;
      background: rgba(255, 254, 249, 0.72);
      border-bottom: 1px solid rgba(243, 223, 189, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-actions {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .brand-icon {
      font-size: 16px;
      line-height: 1;
    }

    .avatar-button {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid rgba(243, 179, 79, 0.14);
      border-radius: 50%;
      background: linear-gradient(135deg, #ffedc7, #fff2d6);
      box-shadow: 0 6px 16px rgba(174, 116, 45, 0.13);
      overflow: hidden;
      cursor: pointer;
    }

    .avatar-button:disabled {
      cursor: default;
    }

    .avatar-button img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .content {
      padding: 18px 20px 0;
    }

    .header-month {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid rgba(243, 179, 79, 0.12);
      border-radius: 999px;
      color: #614a31;
      background: rgba(255, 254, 249, 0.58);
      font-size: 15px;
      font-weight: 760;
      white-space: nowrap;
    }

    .header-month:disabled {
      cursor: default;
    }

    .chevron {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: var(--muted);
    }

    .week-selector {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
      margin: 4px 0 26px;
    }

    .day {
      display: grid;
      justify-items: center;
      gap: 8px;
      min-width: 0;
    }

    .weekday {
      font-size: 12px;
      font-weight: 650;
      color: var(--muted);
      line-height: 1;
    }

    .date {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #735f49;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
    }

    .day.outline .date {
      border: 1.5px solid rgba(243, 179, 79, 0.72);
      color: #d98b2f;
      background: rgba(255, 254, 249, 0.62);
    }

    .day.selected .weekday {
      color: var(--primary-strong);
    }

    .day.selected .date {
      color: #fffef9;
      background: linear-gradient(135deg, #f7c46b, #f2b551);
      box-shadow: 0 8px 16px rgba(243, 179, 79, 0.27);
    }

    .task-section {
      display: grid;
      gap: 12px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 2px;
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 18px;
      font-weight: 760;
    }

    .section-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      color: #fffef9;
      background: linear-gradient(135deg, #f0ad43, #f7c46b);
      box-shadow: 0 8px 16px rgba(95, 120, 244, 0.22);
    }

    .view-all {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      min-height: 36px;
      padding: 0;
      border: 0;
      color: #a18d73;
      background: transparent;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 2px;
    }

    .section-title {
      display: inline-flex;
      align-items: center;

    }

    .section-icon {

      box-shadow: 0 8px 16px rgba(95, 120, 244, 0.22);
    }

    .view-all {
      display: inline-flex;
      align-items: center;
      gap: 2px;

    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 2px;
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 18px;
      font-weight: 760;
    }

    .section-icon {

    }

    .view-all {
      display: inline-flex;
      align-items: center;

      color: #a18d73;
      background: transparent;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
    }

    .task-list {
      display: grid;
      gap: 12px;
    }

    .task-card {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      min-height: 108px;
      padding: 16px;
      border: 1px solid rgba(243, 223, 189, 0.82);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .task-card.is-done {
      border-color: rgba(239, 178, 79, 0.12);
      background: linear-gradient(135deg, var(--success-soft), #fffef9 76%);
    }

    .icon-tile {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 10px;
      overflow: hidden;
      flex: 0 0 auto;
      background: transparent;
    }

    .icon-tile img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .task-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .task-copy {
      min-width: 0;
    }

    .task-date {
      margin-bottom: 5px;
      color: #947b5e;
      font-size: 13.5px;
      font-weight: 650;
      line-height: 1.25;
      white-space: nowrap;
    }

    .task-name {
      margin-bottom: 5px;
      color: #30251a;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.2;
    }

    .task-note {
      color: var(--muted);
      font-size: 14px;
      font-weight: 560;
      line-height: 1.35;
    }

    .checkin-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 86px;
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      color: #fffef9;
      background: linear-gradient(135deg, #f2b551, #e3a044);
      font-size: 16px;
      font-weight: 760;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.14s ease, opacity 0.14s ease;
    }

    .button-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .checkin-button:active {
      transform: scale(0.97);
    }

    .checkin-button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
      transform: none;
      box-shadow: none;
    }

    .checkin-button.is-loading {
      min-width: 44px;
      padding: 0 10px;
      background: transparent;
      box-shadow: none;
      cursor: wait;
    }

    .checkin-button.is-loading:disabled {
      opacity: 1;
    }

    .checkin-button.is-loading .spinner {
      width: 22px;
      height: 22px;
      border-color: rgba(243, 179, 79, 0.18);
      border-top-color: #f3b34f;
    }

    .done-pill {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1.5px solid rgba(239, 178, 79, 0.42);
      border-radius: 50%;
      color: #e39a38;
      background: rgba(255, 254, 249, 0.82);
      flex: 0 0 auto;
    }

    .done-pill svg,
    .checkin-button svg,
    .section-icon svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 254, 249, 0.45);
      border-top-color: #fffef9;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 20;
      width: min(calc(100% - 40px), 420px);
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 16px;
      color: #fffef9;
      background: rgba(38, 45, 70, 0.92);
      box-shadow: 0 16px 36px rgba(38, 45, 70, 0.24);
      font-size: 14px;
      font-weight: 650;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 18px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.error {
      background: rgba(190, 67, 83, 0.94);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .tab-bar {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 30;
      width: min(100%, 480px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      min-height: var(--tab-height);
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(243, 223, 189, 0.9);
      border-radius: 24px 24px 0 0;
      background: rgba(255, 254, 249, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 -10px 30px rgba(174, 116, 45, 0.08);
    }

    .tab-item {
      position: relative;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 4px;
      min-height: 54px;
      padding-top: 6px;
      color: #b29a7a;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
    }

    .tab-item.is-active {
      color: var(--primary-strong);
    }

    .tab-item.is-active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 28px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #f7c46b, #eba84b);
      transform: translateX(-50%);
    }

    @media (max-width: 374px) {
      .content,
      .app-header {
        padding-left: 16px;
        padding-right: 16px;
      }

      .task-card {
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 12px;
        padding: 14px;
      }

      .icon-tile {
        width: 44px;
        height: 44px;
      }

      .task-main {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .checkin-button {
        width: 100%;
      }
    }
  </style>
</head>

  <main class="app-shell">
    <header class="app-header">
      <div class="brand" aria-label="五重祝福">

      </div>

      <div class="header-actions">
        <button class="header-month" type="button" aria-label="目前月份" disabled>
          <span id="currentMonth">--月</span>

        <div class="section-header">

          <a class="view-all" href="all-tasks.html">

        </div>

        <div class="task-list">
          <article class="task-card" data-task-card="morningPrayer">

            </div>
            <div class="task-main">
              <div class="task-copy">

  <script>
    const LIFF_ID = '2010462217-tVZRATTG';
    const CHECKIN_API_URL = '/api/checkin';
    const STATUS_API_URL = '/api/status';

    const taskLabels = {
      morningPrayer: '晨禱',
      smallGroup: '小家',
      sunday: '主日',
      tithe: '十一奉獻'
    };

    const fallbackAvatar = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
        <defs>
          <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
            <stop stop-color="#f3c36b"/>
            <stop offset="1" stop-color="#ffe0a8"/>
          </linearGradient>
        </defs>
        <rect width="80" height="80" fill="url(#g)"/>
        <circle cx="40" cy="32" r="14" fill="#fffef9" opacity=".86"/>
        <path d="M17 70c4-15 14-23 23-23s19 8 23 23" fill="#fffef9" opacity=".86"/>
      </svg>
    `);

    let toastTimer = null;
    let idToken = null;

    const avatarEl = document.getElementById('avatar');
    const toastEl = document.getElementById('toast');
    const currentMonthEl = document.getElementById('currentMonth');
    const weekSelectorEl = document.getElementById('weekSelector');
    const checkinButtons = Array.from(document.querySelectorAll('.checkin-button'));

    avatarEl.src = fallbackAvatar;
    renderCurrentDates();
    setPendingButtonsLoading(true);

    checkinButtons.forEach(button => {
      button.addEventListener('click', () => {
        submitCheckin(button);
      });
    });

    async function submitCheckin(button) {
      if (button.disabled) return;

      const type = button.dataset.type;
      const label = taskLabels[type] || '任務';

      if (!idToken) {
        showToast('尚未完成 LINE 登入，請重新開啟頁面。', 'error');
        return;
      }

      setButtonLoading(button, true);

      try {
        const response = await fetch(CHECKIN_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            idToken,
            blessingType: type
          })
        });

        const data = await parseJsonResponse(response);

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Checkin failed');
        }

        markTaskDone(type);
        showToast(`「${label}」打卡成功！`, 'success');
      } catch (error) {
        setButtonLoading(button, false);
        showToast('打卡失敗，請重新整理後再試一次。', 'error');
      }
    }

    async function loadTaskStatus() {
      if (!idToken) {
        setPendingButtonsUnavailable();
        showToast('尚未完成 LINE 登入，請重新開啟頁面。', 'error');
        return;
      }

      setPendingButtonsLoading(true);

      try {
        const response = await fetch(STATUS_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            idToken
          })
        });

        const data = await parseJsonResponse(response);

        if (!response.ok || !data.success || !data.tasks) {
          throw new Error(data.error || 'Status failed');
        }

        syncVisibleTaskCards(Object.keys(data.tasks));

        Object.entries(data.tasks).forEach(([type, task]) => {
          if (task && task.completed) {
            markTaskDone(type);
          }
        });

        setPendingButtonsLoading(false);
      } catch (error) {
        setPendingButtonsUnavailable();
        showToast('讀取打卡狀態失敗，請重新整理後再試一次。', 'error');
      }
    }

    function syncVisibleTaskCards(visibleTypes) {
      const visibleTypeSet = new Set(visibleTypes);

      document.querySelectorAll('[data-task-card]').forEach(card => {
        const type = card.dataset.taskCard;
        card.hidden = !visibleTypeSet.has(type);
      });
    }

    function setPendingButtonsLoading(isLoading) {
      document.querySelectorAll('.checkin-button').forEach(button => {
        const label = button.querySelector('.button-label');
        button.disabled = isLoading;
        button.classList.toggle('is-loading', isLoading);

        if (isLoading) {
          label.innerHTML = '<span class="spinner" aria-hidden="true"></span>';
          button.setAttribute('aria-label', '載入中');
        } else {
          label.textContent = '打卡';
          button.removeAttribute('aria-label');
        }
      });
    }

    function setPendingButtonsUnavailable() {
      document.querySelectorAll('.checkin-button').forEach(button => {
        const label = button.querySelector('.button-label');
        button.disabled = true;
        button.classList.remove('is-loading');
        label.textContent = '請重試';
        button.removeAttribute('aria-label');
      });
    }

    function setButtonLoading(button, isLoading) {
      const label = button.querySelector('.button-label');
      button.disabled = isLoading;
      button.classList.toggle('is-loading', isLoading);

      if (isLoading) {
        label.innerHTML = '<span class="spinner" aria-hidden="true"></span>';
        button.setAttribute('aria-label', '送出中');
      } else {
        label.textContent = '打卡';
        button.removeAttribute('aria-label');
      }
    }

    function markTaskDone(type) {
      const card = document.querySelector(`[data-task-card="${type}"]`);
      const button = document.querySelector(`.checkin-button[data-type="${type}"]`);

      if (!card || !button) return;

      card.classList.add('is-done');
      button.outerHTML = `
        <div class="done-pill" aria-label="已完成">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      `;
    }

    function showToast(message, type) {
      window.clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.classList.toggle('error', type === 'error');
      toastEl.classList.add('show');

      toastTimer = window.setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2400);
    }

    async function parseJsonResponse(response) {
      const text = await response.text();

      try {
        return JSON.parse(text || '{}');
      } catch (error) {
        return {
          success: false,
          error: text || 'Invalid API response'
        };
      }
    }

    function renderCurrentDates() {
      const today = getTaipeiToday();
      const weekStart = addDays(today, -((today.getDay() + 6) % 7));
      const weekEnd = addDays(weekStart, 6);
      const taskWeekStart = addDays(today, -today.getDay());
      const taskWeekEnd = addDays(taskWeekStart, 6);

      currentMonthEl.textContent = `${today.getMonth() + 1}月`;
      weekSelectorEl.innerHTML = '';
      syncVisibleTaskCards(getVisibleTaskTypes(today));

      for (let index = 0; index < 7; index += 1) {
        const date = addDays(weekStart, index);
        const dayEl = document.createElement('div');
        dayEl.className = 'day';

        if (isSameDate(date, today)) {
          dayEl.classList.add('selected');
          dayEl.setAttribute('aria-current', 'date');
        } else if (date < today) {
          dayEl.classList.add('outline');
        }

        dayEl.innerHTML = `
          <div class="weekday">${formatWeekdayEn(date)}</div>
          <div class="date">${date.getDate()}</div>
        `;

        weekSelectorEl.appendChild(dayEl);
      }

      document.querySelectorAll('[data-date-label="today"]').forEach(el => {
        el.textContent = formatMonthDayWithWeekday(today);
      });

      document.querySelectorAll('[data-date-label="week"]').forEach(el => {
        el.textContent = `${formatMonthDayWithWeekday(taskWeekStart)} - ${formatMonthDayWithWeekday(taskWeekEnd)}`;
      });

      document.querySelectorAll('[data-date-label="month"]').forEach(el => {
        el.textContent = `${today.getMonth() + 1}月`;
      });
    }

    function getVisibleTaskTypes(date) {
      const tasks = ['smallGroup', 'sunday', 'tithe'];
      const dayOfWeek = date.getDay();

      if (dayOfWeek >= 2 && dayOfWeek <= 6) {
        tasks.unshift('morningPrayer');
      }

      return tasks;
    }

    function getTaipeiToday() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Taipei',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(new Date());

      const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
      return new Date(Number(values.year), Number(values.month) - 1, Number(values.day));
    }

    function addDays(date, days) {
      const next = new Date(date);
      next.setDate(next.getDate() + days);
      return next;
    }

    function isSameDate(a, b) {
      return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
    }

    function formatWeekdayEn(date) {
      return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][date.getDay()];
    }

    function formatWeekdayZh(date) {
      return ['日', '一', '二', '三', '四', '五', '六'][date.getDay()];
    }

    function formatMonthDayWithWeekday(date) {
      return `${date.getMonth() + 1}/${date.getDate()}（${formatWeekdayZh(date)}）`;
    }

    async function loadLiffAvatar() {
      if (!window.liff) {
        setPendingButtonsUnavailable();
        return;
      }

      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error('Missing LINE idToken');
        }

        if (profile.pictureUrl) {
          avatarEl.src = profile.pictureUrl;
        }

        await loadTaskStatus();
      } catch (error) {
        avatarEl.src = fallbackAvatar;
        setPendingButtonsUnavailable();
      }
    }

    loadLiffAvatar();
  </script>
</body>
</html>
