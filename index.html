<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>五重祝福打卡</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --page-bg: #f5f7ff;
      --card: #ffffff;
      --ink: #1f2433;
      --muted: #7b849b;
      --line: #e8ecf8;
      --primary: #6a7df8;
      --primary-strong: #5067ee;
      --success: #22c58f;
      --success-soft: #f0fbf5;
      --shadow: 0 10px 28px rgba(83, 95, 143, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--page-bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 10% 14%, rgba(214, 207, 255, 0.55), transparent 34%),
        radial-gradient(circle at 90% 5%, rgba(202, 232, 255, 0.42), transparent 30%),
        linear-gradient(180deg, #f7f4ff 0%, #f4f8ff 42%, #fbfcff 100%);
    }

    button {
      font: inherit;
    }

    .app-shell {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: calc(10px + env(safe-area-inset-top)) 20px 10px;
      background: rgba(255, 255, 255, 0.72);
      border-bottom: 1px solid rgba(232, 236, 248, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-actions {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .brand-icon {
      font-size: 16px;
      line-height: 1;
    }

    .avatar-button {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid rgba(106, 125, 248, 0.14);
      border-radius: 50%;
      background: linear-gradient(135deg, #dde5ff, #f3e6ff);
      box-shadow: 0 6px 16px rgba(82, 95, 160, 0.13);
      overflow: hidden;
      cursor: pointer;
    }

    .avatar-button:disabled {
      cursor: default;
    }

    .avatar-button img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .content {
      padding: 18px 20px 0;
    }

    .header-month {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      padding: 0 8px 0 12px;
      border: 1px solid rgba(106, 125, 248, 0.12);
      border-radius: 999px;
      color: #39415f;
      background: rgba(255, 255, 255, 0.58);
      font-size: 15px;
      font-weight: 760;
      white-space: nowrap;
    }

    .chevron {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: var(--muted);
    }

    .week-selector {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
      margin: 4px 0 26px;
    }

    .day {
      display: grid;
      justify-items: center;
      gap: 8px;
      min-width: 0;
    }

    .weekday {
      font-size: 12px;
      font-weight: 650;
      color: var(--muted);
      line-height: 1;
    }

    .date {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #4b5568;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
    }

    .day.outline .date {
      border: 1.5px solid rgba(106, 125, 248, 0.72);
      color: #4856bf;
      background: rgba(255, 255, 255, 0.62);
    }

    .day.selected .weekday {
      color: var(--primary-strong);
    }

    .day.selected .date {
      color: #fff;
      background: linear-gradient(135deg, #7f91ff, #9b84ee);
      box-shadow: 0 8px 16px rgba(106, 125, 248, 0.27);
    }

    .task-section {
      display: grid;
      gap: 12px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 2px;
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 18px;
      font-weight: 760;
    }

    .section-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      color: #fff;
      background: linear-gradient(135deg, #5f78f4, #738aff);
      box-shadow: 0 8px 16px rgba(95, 120, 244, 0.22);
    }

    .view-all {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      min-height: 36px;
      padding: 0;
      border: 0;
      color: #8a93aa;
      background: transparent;
      font-size: 14px;
      font-weight: 650;
      cursor: default;
      opacity: 0.74;
    }

    .task-list {
      display: grid;
      gap: 12px;
    }

    .task-card {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      min-height: 108px;
      padding: 16px;
      border: 1px solid rgba(232, 236, 248, 0.82);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .task-card.is-done {
      border-color: rgba(34, 197, 143, 0.12);
      background: linear-gradient(135deg, var(--success-soft), #ffffff 76%);
    }

    .icon-tile {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 10px;
      flex: 0 0 auto;
    }

    .icon-tile svg {
      width: 28px;
      height: 28px;
    }

    .icon-tile.mint {
      color: #22b98b;
      background: linear-gradient(135deg, #e3f8ec, #f2fbf5);
    }

    .icon-tile.lavender {
      color: #8172f6;
      background: linear-gradient(135deg, #ebe8ff, #f5f1ff);
    }

    .icon-tile.sun {
      color: #ee9d27;
      background: linear-gradient(135deg, #fff0c8, #fff7e7);
    }

    .icon-tile.blue {
      color: #3aa8ec;
      background: linear-gradient(135deg, #ddf2ff, #edf8ff);
    }

    .task-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .task-copy {
      min-width: 0;
    }

    .task-date {
      margin-bottom: 5px;
      color: #7180a6;
      font-size: 13.5px;
      font-weight: 650;
      line-height: 1.25;
      white-space: nowrap;
    }

    .task-name {
      margin-bottom: 5px;
      color: #171b28;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.2;
    }

    .task-note {
      color: var(--muted);
      font-size: 14px;
      font-weight: 560;
      line-height: 1.35;
    }

    .checkin-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 86px;
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      color: #ffffff;
      background: linear-gradient(135deg, #20c98e, #24b978);
      box-shadow: 0 9px 18px rgba(31, 191, 132, 0.26);
      font-size: 16px;
      font-weight: 760;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.14s ease, opacity 0.14s ease, box-shadow 0.14s ease;
    }

    .button-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .checkin-button:active {
      transform: scale(0.97);
    }

    .checkin-button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
      transform: none;
      box-shadow: none;
    }

    .done-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      min-width: 90px;
      padding: 0 12px;
      border: 1px solid rgba(34, 197, 143, 0.18);
      border-radius: 999px;
      color: #19b980;
      background: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      font-weight: 760;
      white-space: nowrap;
    }

    .done-pill svg,
    .checkin-button svg,
    .section-icon svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 20;
      width: min(calc(100% - 40px), 420px);
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 16px;
      color: #ffffff;
      background: rgba(38, 45, 70, 0.92);
      box-shadow: 0 16px 36px rgba(38, 45, 70, 0.24);
      font-size: 14px;
      font-weight: 650;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 18px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.error {
      background: rgba(190, 67, 83, 0.94);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 374px) {
      .content,
      .app-header {
        padding-left: 16px;
        padding-right: 16px;
      }

      .task-card {
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 12px;
        padding: 14px;
      }

      .icon-tile {
        width: 44px;
        height: 44px;
      }

      .task-main {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .checkin-button,
      .done-pill {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand" aria-label="五重祝福">
        <span>五重祝福</span>
        <span class="brand-icon" aria-hidden="true">✨</span>
      </div>

      <div class="header-actions">
        <button class="header-month" type="button" aria-label="選擇月份">
          <span id="currentMonth">--月</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <button class="avatar-button" type="button" aria-label="使用者資料">
          <img id="avatar" alt="" />
        </button>
      </div>
    </header>

    <div class="content">
      <section aria-label="週日期選擇">
        <div class="week-selector" id="weekSelector"></div>
      </section>

      <section class="task-section" aria-labelledby="task-title">
        <div class="section-header">
          <div class="section-title" id="task-title">
            <span class="section-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M7 3v3M17 3v3M4.5 9.2h15M6.5 5h11A2.5 2.5 0 0 1 20 7.5v10A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-10A2.5 2.5 0 0 1 6.5 5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </span>
            <span>本期任務</span>
          </div>

          <button class="view-all" type="button" disabled>
            <span>查看全部</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <div class="task-list">
          <article class="task-card" data-task-card="morningPrayer">
            <div class="icon-tile mint" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M5 15a7 7 0 0 1 14 0H5Z" fill="currentColor" opacity=".9" />
                <path d="M12 3v3M4.9 6.9 7 9M19.1 6.9 17 9M3 15h18M7 19h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </div>
            <div class="task-main">
              <div class="task-copy">
                <div class="task-date" data-date-label="today">--/--</div>
                <div class="task-name">晨禱</div>
                <div class="task-note">今日可打卡</div>
              </div>
              <button class="checkin-button" type="button" data-type="morningPrayer">
                <span class="button-label">打卡</span>
              </button>
            </div>
          </article>

          <article class="task-card" data-task-card="smallGroup">
            <div class="icon-tile lavender" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 11.3 12 5l8 6.3V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-8.7Z" fill="currentColor" opacity=".9" />
                <path d="m3 12 9-7 9 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <div class="task-main">
              <div class="task-copy">
                <div class="task-date" data-date-label="week">--/-- - --/--</div>
                <div class="task-name">小家</div>
                <div class="task-note">本週完成一次</div>
              </div>
              <button class="checkin-button" type="button" data-type="smallGroup">
                <span class="button-label">打卡</span>
              </button>
            </div>
          </article>

          <article class="task-card" data-task-card="sunday">
            <div class="icon-tile sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M5 10.5 12 5l7 5.5V20H5v-9.5Z" fill="currentColor" opacity=".88" />
                <path d="M12 5V2M8 20v-5h8v5M9.5 12h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <div class="task-main">
              <div class="task-copy">
                <div class="task-date" data-date-label="week">--/-- - --/--</div>
                <div class="task-name">主日</div>
                <div class="task-note">本週完成一次</div>
              </div>
              <button class="checkin-button" type="button" data-type="sunday">
                <span class="button-label">打卡</span>
              </button>
            </div>
          </article>

          <article class="task-card" data-task-card="tithe">
            <div class="icon-tile blue" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 20s-7-4.3-7-9.2A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.8C19 15.7 12 20 12 20Z" fill="currentColor" opacity=".9" />
                <path d="M4 20h6.8c1.4 0 2.7-.5 3.7-1.5l4-4a2 2 0 0 0-2.8-2.8l-2.6 2.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <div class="task-main">
              <div class="task-copy">
                <div class="task-date" data-date-label="month">--月</div>
                <div class="task-name">十一奉獻</div>
                <div class="task-note">本月完成一次</div>
              </div>
              <button class="checkin-button" type="button" data-type="tithe">
                <span class="button-label">打卡</span>
              </button>
            </div>
          </article>
        </div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    const LIFF_ID = '2010462217-tVZRATTG';
    const API_URL = '/api/checkin';

    const taskLabels = {
      morningPrayer: '晨禱',
      smallGroup: '小家',
      sunday: '主日',
      tithe: '十一奉獻'
    };

    const fallbackAvatar = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
        <defs>
          <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
            <stop stop-color="#8fa1ff"/>
            <stop offset="1" stop-color="#f0c9ff"/>
          </linearGradient>
        </defs>
        <rect width="80" height="80" fill="url(#g)"/>
        <circle cx="40" cy="32" r="14" fill="#fff" opacity=".86"/>
        <path d="M17 70c4-15 14-23 23-23s19 8 23 23" fill="#fff" opacity=".86"/>
      </svg>
    `);

    let toastTimer = null;
    let idToken = null;

    const avatarEl = document.getElementById('avatar');
    const toastEl = document.getElementById('toast');
    const currentMonthEl = document.getElementById('currentMonth');
    const weekSelectorEl = document.getElementById('weekSelector');
    const checkinButtons = Array.from(document.querySelectorAll('.checkin-button'));

    avatarEl.src = fallbackAvatar;
    renderCurrentDates();

    checkinButtons.forEach(button => {
      button.addEventListener('click', () => {
        submitCheckin(button);
      });
    });

    async function submitCheckin(button) {
      if (button.disabled) return;

      const type = button.dataset.type;
      const label = taskLabels[type] || '任務';

      if (!idToken) {
        showToast('尚未完成 LINE 登入，請重新開啟頁面。', 'error');
        return;
      }

      setButtonLoading(button, true);

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            idToken,
            blessingType: type
          })
        });

        const data = await parseJsonResponse(response);

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Checkin failed');
        }

        markTaskDone(type);
        showToast(`「${label}」打卡成功！`, 'success');
      } catch (error) {
        setButtonLoading(button, false);
        showToast('打卡失敗，請重新整理後再試一次。', 'error');
      }
    }

    function setButtonLoading(button, isLoading) {
      const label = button.querySelector('.button-label');
      button.disabled = isLoading;

      if (isLoading) {
        button.dataset.previousLabel = label.textContent;
        label.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>送出中</span>';
      } else {
        label.textContent = button.dataset.previousLabel || '打卡';
      }
    }

    function markTaskDone(type) {
      const card = document.querySelector(`[data-task-card="${type}"]`);
      const button = document.querySelector(`.checkin-button[data-type="${type}"]`);

      if (!card || !button) return;

      card.classList.add('is-done');
      button.outerHTML = `
        <div class="done-pill" aria-label="已完成">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>已完成</span>
        </div>
      `;
    }

    function showToast(message, type) {
      window.clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.classList.toggle('error', type === 'error');
      toastEl.classList.add('show');

      toastTimer = window.setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2400);
    }

    async function parseJsonResponse(response) {
      const text = await response.text();

      try {
        return JSON.parse(text || '{}');
      } catch (error) {
        return {
          success: false,
          error: text || 'Invalid API response'
        };
      }
    }

    function renderCurrentDates() {
      const today = getTaipeiToday();
      const weekStart = addDays(today, -((today.getDay() + 6) % 7));
      const weekEnd = addDays(weekStart, 6);

      currentMonthEl.textContent = `${today.getMonth() + 1}月`;
      weekSelectorEl.innerHTML = '';

      for (let index = 0; index < 7; index += 1) {
        const date = addDays(weekStart, index);
        const dayEl = document.createElement('div');
        dayEl.className = 'day';

        if (isSameDate(date, today)) {
          dayEl.classList.add('selected');
          dayEl.setAttribute('aria-current', 'date');
        } else if (date < today) {
          dayEl.classList.add('outline');
        }

        dayEl.innerHTML = `
          <div class="weekday">${formatWeekdayEn(date)}</div>
          <div class="date">${date.getDate()}</div>
        `;

        weekSelectorEl.appendChild(dayEl);
      }

      document.querySelectorAll('[data-date-label="today"]').forEach(el => {
        el.textContent = formatMonthDayWithWeekday(today);
      });

      document.querySelectorAll('[data-date-label="week"]').forEach(el => {
        el.textContent = `${formatMonthDayWithWeekday(weekStart)} - ${formatMonthDayWithWeekday(weekEnd)}`;
      });

      document.querySelectorAll('[data-date-label="month"]').forEach(el => {
        el.textContent = `${today.getMonth() + 1}月`;
      });
    }

    function getTaipeiToday() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Taipei',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(new Date());

      const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
      return new Date(Number(values.year), Number(values.month) - 1, Number(values.day));
    }

    function addDays(date, days) {
      const next = new Date(date);
      next.setDate(next.getDate() + days);
      return next;
    }

    function isSameDate(a, b) {
      return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
    }

    function formatWeekdayEn(date) {
      return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][date.getDay()];
    }

    function formatWeekdayZh(date) {
      return ['日', '一', '二', '三', '四', '五', '六'][date.getDay()];
    }

    function formatMonthDayWithWeekday(date) {
      return `${date.getMonth() + 1}/${date.getDate()}（${formatWeekdayZh(date)}）`;
    }

    async function loadLiffAvatar() {
      if (!window.liff) return;

      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        idToken = liff.getIDToken();

        if (profile.pictureUrl) {
          avatarEl.src = profile.pictureUrl;
        }
      } catch (error) {
        avatarEl.src = fallbackAvatar;
      }
    }

    loadLiffAvatar();
  </script>
</body>
