<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>五重祝福打卡</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --page-bg: #fffdf8;
      --card: #ffffff;
      --ink: #25211c;
      --muted: #807363;
      --line: #f6ddb2;
      --primary: #ff9f1c;
      --primary-strong: #f18a00;
      --success: #ffad2e;
      --success-soft: #fffdf8;
      --shadow: 0 10px 28px rgba(185, 117, 32, 0.08);
      --tab-height: 72px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--page-bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 10% 14%, rgba(255, 225, 166, 0.32), transparent 34%),
        radial-gradient(circle at 90% 5%, rgba(255, 243, 205, 0.28), transparent 30%),
        linear-gradient(180deg, #fffaf0 0%, #fffdf8 42%, #ffffff 100%);
    }

    button {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .app-shell {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: calc(var(--tab-height) + 24px + env(safe-area-inset-bottom));
    }

    .auth-screen {
      display: grid;
      place-items: center;
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    }

    .auth-screen.is-loading {
      position: fixed;
      top: calc(64px + env(safe-area-inset-top));
      left: 50%;
      z-index: 1;
      align-items: start;
      width: min(100%, 480px);
      min-height: calc(100vh - 64px - var(--tab-height) - env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding-top: 126px;
      padding-bottom: calc(var(--tab-height) + 24px + env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .auth-card {
      width: 100%;
      padding: 30px 24px;
      border: 1px solid rgba(246, 221, 178, 0.74);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .auth-screen.is-loading .auth-card {
      display: grid;
      justify-items: center;
      gap: 14px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .auth-title {
      margin: 0 0 10px;
      color: var(--ink);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .auth-screen.is-loading .auth-title {
      display: none;
    }

    .auth-desc {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.55;
    }

    .auth-screen.is-loading .auth-desc {
      order: 2;
      margin: 0;
      font-weight: 700;
    }

    .auth-spinner {
      width: 34px;
      height: 34px;
      margin: 4px auto 0;
      border: 3px solid rgba(255, 159, 28, 0.18);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .auth-screen.is-loading .auth-spinner {
      order: 1;
      margin: 0;
      border-top-color: var(--primary-strong);
      animation-duration: 0.78s;
    }

    .auth-login-button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      color: #ffffff;
      background: linear-gradient(135deg, #ffb547, #ffa927);
      box-shadow: 0 12px 22px rgba(255, 159, 28, 0.24);
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: calc(10px + env(safe-area-inset-top)) 20px 10px;
      background: rgba(255, 255, 253, 0.84);
      border-bottom: 1px solid rgba(246, 221, 178, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-actions {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .brand-icon {
      font-size: 16px;
      line-height: 1;
    }

    .avatar-button {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid rgba(255, 159, 28, 0.14);
      border-radius: 50%;
      background: linear-gradient(135deg, #ffe4ac, #fff1d2);
      box-shadow: 0 6px 16px rgba(185, 117, 32, 0.13);
      overflow: hidden;
      cursor: pointer;
    }

    .avatar-button:disabled {
      cursor: default;
    }

    .avatar-button img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .content {
      padding: 18px 20px 0;
    }

    body.is-auth-loading .app-shell {
      min-height: auto;
      padding-bottom: 0;
    }

    body.is-auth-loading .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
    }

    body.is-auth-loading .content {
      display: none;
    }

    .header-month {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid rgba(255, 159, 28, 0.12);
      border-radius: 999px;
      color: #4e3d2b;
      background: rgba(255, 255, 253, 0.74);
      font-size: 15px;
      font-weight: 760;
      white-space: nowrap;
    }

    .header-month:disabled {
      cursor: default;
    }

    .chevron {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: var(--muted);
    }

    .week-selector {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
      margin: 4px 0 26px;
    }

    .day {
      display: grid;
      justify-items: center;
      gap: 8px;
      min-width: 0;
    }

    .weekday {
      font-size: 12px;
      font-weight: 650;
      color: var(--muted);
      line-height: 1;
    }

    .date {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #756553;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
    }

    .day.outline .date {
      border: 1.5px solid rgba(255, 159, 28, 0.72);
      color: #f18a00;
      background: rgba(255, 255, 253, 0.78);
    }

    .day.selected .weekday {
      color: var(--primary-strong);
    }

    .day.selected .date {
      color: #ffffff;
      background: linear-gradient(135deg, #ffb547, #ffa927);
      box-shadow: 0 8px 16px rgba(255, 159, 28, 0.27);
    }

    .task-section {
      display: grid;
      gap: 12px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 2px;
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 18px;
      font-weight: 760;
    }

    .section-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      color: #ffffff;
      background: linear-gradient(135deg, #ffa21d, #ffb547);
      box-shadow: 0 8px 16px rgba(255, 159, 28, 0.22);
    }

    .view-all {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      min-height: 36px;
      padding: 0;
      border: 0;
      color: var(--primary-strong);
      background: transparent;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 2px;
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 18px;
      font-weight: 760;
    }

    .section-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      color: #ffffff;
      background: linear-gradient(135deg, #ffa21d, #ffb547);
      box-shadow: 0 8px 16px rgba(255, 159, 28, 0.22);
    }

    .view-all {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      min-height: 36px;
      padding: 0;
      border: 0;
      color: var(--primary-strong);
      background: transparent;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 2px;
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 18px;
      font-weight: 760;
    }

    .section-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      color: #ffffff;
      background: linear-gradient(135deg, #ffa21d, #ffb547);
      box-shadow: 0 8px 16px rgba(255, 159, 28, 0.22);
    }

    .view-all {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      min-height: 36px;
      padding: 0;
      border: 0;
      color: var(--primary-strong);
      background: transparent;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
    }

    .task-list {
      display: grid;
      gap: 12px;
    }

    .task-card {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      min-height: 108px;
      padding: 16px;
      border: 1px solid rgba(246, 221, 178, 0.44);
      border-radius: 18px;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .task-card.is-done {
      border-color: rgba(255, 173, 46, 0.22);
      background: linear-gradient(135deg, #ffffff 0%, #fffdf8 100%);
    }

    .icon-tile {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 10px;
      overflow: hidden;
      flex: 0 0 auto;
      background: transparent;
    }

    .icon-tile img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .task-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .task-copy {
      min-width: 0;
    }

    .task-date {
      margin-bottom: 5px;
      color: #8d7a61;
      font-size: 13.5px;
      font-weight: 650;
      line-height: 1.25;
      white-space: nowrap;
    }

    .task-name {
      margin-bottom: 5px;
      color: #25211c;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.2;
    }

    .task-note {
      color: var(--muted);
      font-size: 14px;
      font-weight: 560;
      line-height: 1.35;
    }

    .checkin-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 86px;
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      color: #ffffff;
      background: linear-gradient(135deg, #ffa927, #f29a12);
      font-size: 16px;
      font-weight: 760;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.14s ease, opacity 0.14s ease;
    }

    .button-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .checkin-button:active {
      transform: scale(0.97);
    }

    .checkin-button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
      transform: none;
      box-shadow: none;
    }

    .checkin-button.is-loading {
      min-width: 44px;
      padding: 0 10px;
      background: transparent;
      box-shadow: none;
      cursor: wait;
    }

    .checkin-button.is-loading:disabled {
      opacity: 1;
    }

    .checkin-button.is-loading .spinner {
      width: 22px;
      height: 22px;
      border-color: rgba(255, 159, 28, 0.18);
      border-top-color: #ff9f1c;
    }

    .checkin-button.is-done {
      min-width: 44px;
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      color: #f29200;
      background: rgba(255, 255, 253, 0.9);
      border: 1.5px solid rgba(255, 173, 46, 0.42);
      box-shadow: none;
    }

    .checkin-button.is-done:not(.is-loading):active {
      transform: scale(0.97);
    }

    .checkin-button.is-done.is-loading {
      min-width: 44px;
      padding: 0 10px;
      background: transparent;
      border-color: transparent;
    }

    .checkin-button.is-done.is-loading .spinner {
      border-color: rgba(255, 159, 28, 0.18);
      border-top-color: #ff9f1c;
    }

    .done-pill {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1.5px solid rgba(255, 173, 46, 0.42);
      border-radius: 50%;
      color: #f29200;
      background: rgba(255, 255, 253, 0.9);
      flex: 0 0 auto;
    }

    .done-pill svg,
    .checkin-button svg,
    .section-icon svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 254, 249, 0.45);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 20;
      width: min(calc(100% - 40px), 420px);
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 16px;
      color: #ffffff;
      background: rgba(69, 51, 32, 0.92);
      box-shadow: 0 16px 36px rgba(69, 51, 32, 0.24);
      font-size: 14px;
      font-weight: 650;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 18px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.error {
      background: rgba(190, 67, 83, 0.94);
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(37, 33, 28, 0);
      pointer-events: none;
      transition: background 0.22s ease;
    }

    .settings-overlay.is-open {
      background: rgba(37, 33, 28, 0.38);
      pointer-events: auto;
    }

    .settings-sheet {
      position: relative;
      width: min(100%, 480px);
      padding: 8px 20px calc(18px + env(safe-area-inset-bottom));
      border-radius: 32px 32px 0 0;
      background: rgba(255, 253, 248, 0.98);
      box-shadow: 0 -18px 44px rgba(69, 51, 32, 0.16);
      transform: translate3d(0, calc(100% - var(--settings-keyboard-offset, 0px)), 0);
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .settings-overlay.is-open .settings-sheet {
      transform: translate3d(0, calc(-1 * var(--settings-keyboard-offset, 0px)), 0);
    }

    .settings-sheet::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(-1 * var(--settings-keyboard-offset, 0px));
      height: var(--settings-keyboard-offset, 0px);
      background: inherit;
      pointer-events: none;
    }

    .settings-sheet.is-keyboard-open {
      overscroll-behavior: none;
      touch-action: none;
    }

    .settings-handle {
      width: 54px;
      height: 5px;
      margin: 0 auto 24px;
      border-radius: 999px;
      background: #d9cec0;
    }

    .settings-title {
      margin: 0 0 22px;
      color: var(--ink);
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0;
    }

    .settings-actions {
      display: grid;
      gap: 16px;
    }

    .settings-row,
    .settings-logout,
    .nickname-save {
      width: 100%;
      min-height: 58px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 20px;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.82);
      font-size: 16px;
      font-weight: 720;
      text-align: left;
      cursor: pointer;
    }

    .settings-row {
      border: 1px solid rgba(246, 221, 178, 0.68);
      color: #7a6c5a;
      box-shadow: 0 8px 20px rgba(185, 117, 32, 0.06);
    }

    .settings-row svg,
    .settings-logout svg,
    .nickname-save svg {
      width: 22px;
      height: 22px;
    }

    .settings-row .settings-leading {
      color: var(--primary-strong);
    }

    .settings-chevron {
      color: #817466;
      justify-self: end;
    }

    .settings-logout {
      grid-template-columns: 24px minmax(0, 1fr);
      border: 1px solid rgba(255, 81, 72, 0.7);
      color: #f04f45;
      background: rgba(255, 255, 255, 0.76);
      text-align: center;
    }

    .settings-logout span,
    .nickname-save span {
      justify-self: center;
    }

    .nickname-field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .nickname-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .nickname-input {
      width: 100%;
      min-height: 56px;
      padding: 0 16px;
      border: 1px solid rgba(246, 221, 178, 0.82);
      border-radius: 16px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.84);
      font: inherit;
      font-size: 16px;
      font-weight: 650;
      outline: none;
    }

    .nickname-input:focus {
      border-color: rgba(255, 159, 28, 0.72);
      box-shadow: 0 0 0 3px rgba(255, 159, 28, 0.12);
    }

    .nickname-save {
      grid-template-columns: 24px minmax(0, 1fr);
      border: 0;
      color: #ffffff;
      background: linear-gradient(135deg, #ffb547, #ffa927);
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .tab-bar {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 30;
      width: min(100%, 480px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      min-height: var(--tab-height);
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(246, 221, 178, 0.64);
      border-radius: 24px 24px 0 0;
      background: rgba(255, 255, 252, 0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 -10px 30px rgba(185, 117, 32, 0.055);
    }

    .tab-item {
      position: relative;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 4px;
      min-height: 54px;
      padding-top: 6px;
      color: #a89576;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
    }

    .tab-item.is-active {
      color: var(--primary-strong);
    }

    .tab-item.is-active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 28px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffb547, #ffac2f);
      transform: translateX(-50%);
    }

    @media (max-width: 374px) {
      .content,
      .app-header {
        padding-left: 16px;
        padding-right: 16px;
      }

      .task-card {
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 12px;
        padding: 14px;
      }

      .icon-tile {
        width: 44px;
        height: 44px;
      }

      .task-main {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .checkin-button {
        width: 100%;
      }
    }
  </style>
</head>

<body class="is-auth-loading">
  <section class="auth-screen is-loading" id="authScreen" aria-live="polite">
    <div class="auth-card">
      <h1 class="auth-title">五重祝福打卡</h1>
      <p class="auth-desc" id="authDesc">正在初始化 LINE 登入...</p>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    const LIFF_ID = '2010462217-tVZRATTG';
    const CHECKIN_API_URL = '/api/checkin';
    const UNCHECKIN_API_URL = '/api/uncheckin';
    const STATUS_API_URL = '/api/status';
    const TEAM_API_URL = '/api/team';

    const taskLabels = {
      morningPrayer: '晨禱',
      smallGroup: '小家',
      sunday: '主日',
      tithe: '十一奉獻'
    };

    const fallbackAvatar = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
        <defs>
          <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
            <stop stop-color="#ffc15a"/>
            <stop offset="1" stop-color="#ffd98b"/>
          </linearGradient>
        </defs>
        <rect width="80" height="80" fill="url(#g)"/>
        <circle cx="40" cy="32" r="14" fill="#ffffff" opacity=".86"/>
        <path d="M17 70c4-15 14-23 23-23s19 8 23 23" fill="#ffffff" opacity=".86"/>
      </svg>
    `);

    let toastTimer = null;
    let idToken = null;
    let currentNickname = '';
    let activeSettingsOverlay = null;
    let settingsKeyboardUpdateFrame = null;

    const avatarEl = document.getElementById('avatar');
    const avatarButton = document.querySelector('.avatar-button');
    const toastEl = document.getElementById('toast');
    const currentMonthEl = document.getElementById('currentMonth');
    const weekSelectorEl = document.getElementById('weekSelector');
    const authScreenEl = document.getElementById('authScreen');
    const authDescEl = document.getElementById('authDesc');
    const authSpinnerEl = document.getElementById('authSpinner');
    const lineLoginButton = document.getElementById('lineLoginButton');
    const appShellEl = document.getElementById('appShell');
    const tabBarEl = document.getElementById('tabBar');
    const profileSettingsOverlay = document.getElementById('profileSettingsOverlay');
    const nicknameOverlay = document.getElementById('nicknameOverlay');
    const nicknameSheetButton = document.getElementById('nicknameSheetButton');
    const lineLogoutButton = document.getElementById('lineLogoutButton');
    const nicknameSaveButton = document.getElementById('nicknameSaveButton');
    const nicknameInput = document.getElementById('nicknameInput');
    const taskListEl = document.querySelector('.task-list');

    avatarEl.src = fallbackAvatar;
    renderCurrentDates();
    setPendingButtonsLoading(true);

    taskListEl.addEventListener('click', event => {
      const button = event.target.closest('.checkin-button');
      if (!button || button.disabled) return;

      if (button.dataset.state === 'done') {
        submitUncheckin(button);
        return;
      }

      submitCheckin(button);
    });

    lineLoginButton.addEventListener('click', startLineLogin);
    avatarButton.addEventListener('click', openProfileSettings);
    nicknameSheetButton.addEventListener('click', openNicknameSheet);
    lineLogoutButton.addEventListener('click', logoutLineAccount);
    nicknameSaveButton.addEventListener('click', saveNickname);
    [profileSettingsOverlay, nicknameOverlay].forEach(overlay => {
      overlay.addEventListener('click', event => {
        if (event.target === overlay) {
          closeSettingsOverlay(overlay);
        }
      });
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeSettingsOverlay(nicknameOverlay);
        closeSettingsOverlay(profileSettingsOverlay);
      }
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleSettingsKeyboardOffsetUpdate);
      window.visualViewport.addEventListener('scroll', scheduleSettingsKeyboardOffsetUpdate);
    }
    window.addEventListener('resize', scheduleSettingsKeyboardOffsetUpdate);

    async function submitUncheckin(button) {
      if (button.disabled) return;

      const type = button.dataset.type;
      const label = taskLabels[type] || '任務';
      const periodKey = button.dataset.periodKey || '';

      if (!idToken) {
        showToast('尚未完成 LINE 登入，請重新開啟頁面。', 'error');
        return;
      }

      if (!window.confirm(`確定要取消「${label}」打卡嗎？`)) {
        return;
      }

      setButtonLoading(button, true);

      try {
        const response = await fetch(UNCHECKIN_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            idToken,
            blessingType: type,
            periodKey
          })
        });

        const data = await parseJsonResponse(response);

        if (isExpiredTokenResponse(response, data)) {
          handleAuthExpired();
          return;
        }

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Uncheckin failed');
        }

        await loadTaskStatus();
        showToast(`「${label}」已取消打卡`, 'success');
      } catch (error) {
        console.error('Uncheckin failed', error);
        setButtonLoading(button, false);
        showToast('取消打卡失敗，請重新整理後再試一次。', 'error');
      }
    }

    async function submitCheckin(button) {
      if (button.disabled) return;

      const type = button.dataset.type;
      const label = taskLabels[type] || '任務';
      const periodKey = button.dataset.periodKey || '';

      if (!idToken) {
        showToast('尚未完成 LINE 登入，請重新開啟頁面。', 'error');
        return;
      }

      setButtonLoading(button, true);

      try {
        const response = await fetch(CHECKIN_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            idToken,
            blessingType: type,
            periodKey
          })
        });

        const data = await parseJsonResponse(response);

        if (isExpiredTokenResponse(response, data)) {
          handleAuthExpired();
          return;
        }

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Checkin failed');
        }

        await loadTaskStatus();
        showToast(`「${label}」打卡成功！`, 'success');
      } catch (error) {
        console.error('Checkin failed', error);
        setButtonLoading(button, false);
        showToast('打卡失敗，請重新整理後再試一次。', 'error');
      }
    }

    async function loadTaskStatus() {
      if (!idToken) {
        handleAuthExpired();
        return;
      }

      setPendingButtonsLoading(true);

      try {
        const response = await fetch(STATUS_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            idToken
          })
        });

        const data = await parseJsonResponse(response);

        if (isExpiredTokenResponse(response, data)) {
          handleAuthExpired();
          return;
        }

        if (!response.ok || !data.success || !data.tasks) {
          throw new Error(data.error || 'Status failed');
        }

        syncVisibleTaskCards(Object.keys(data.tasks));
        setPendingButtonsLoading(false);

        Object.entries(data.tasks).forEach(([type, task]) => {
          applyTaskStatus(type, task);
        });
      } catch (error) {
        console.error('Status API failed', error);
        setPendingButtonsUnavailable();
        showToast('讀取打卡狀態失敗，請重新整理後再試一次。', 'error');
      }
    }

    function syncVisibleTaskCards(visibleTypes) {
      const visibleTypeSet = new Set(visibleTypes);

      document.querySelectorAll('[data-task-card]').forEach(card => {
        const type = card.dataset.taskCard;
        card.hidden = !visibleTypeSet.has(type);
      });
    }

    function getTaskButton(type) {
      return document.querySelector(`.checkin-button[data-type="${type}"]`);
    }

    function applyTaskStatus(type, task) {
      if (!task) return;

      updateTaskMeta(type, task);

      if (task.completed) {
        markTaskDone(type);
        return;
      }

      markTaskPending(type);
    }

    function updateTaskMeta(type, task) {
      const card = document.querySelector(`[data-task-card="${type}"]`);
      const button = getTaskButton(type);

      if (!card || !button) return;

      button.dataset.periodKey = task.periodKey || '';

      const dateEl = card.querySelector('.task-date');
      if (dateEl && task.dateLabel) {
        dateEl.textContent = task.dateLabel;
      }

      const noteEl = card.querySelector('.task-note');
      if (noteEl && task.note) {
        noteEl.textContent = task.note;
      }
    }

    function setPendingButtonsLoading(isLoading) {
      document.querySelectorAll('.checkin-button:not(.is-done)').forEach(button => {
        const label = button.querySelector('.button-label');
        button.disabled = isLoading;
        button.classList.toggle('is-loading', isLoading);

        if (isLoading) {
          label.innerHTML = '<span class="spinner" aria-hidden="true"></span>';
          button.setAttribute('aria-label', '載入中');
        } else {
          label.textContent = '打卡';
          button.removeAttribute('aria-label');
        }
      });
    }

    function setPendingButtonsUnavailable() {
      document.querySelectorAll('.checkin-button:not(.is-done)').forEach(button => {
        const label = button.querySelector('.button-label');
        if (!label) return;
        button.disabled = true;
        button.classList.remove('is-loading');
        label.textContent = '請重試';
        button.removeAttribute('aria-label');
      });
    }

    function setButtonLoading(button, isLoading) {
      const label = button.querySelector('.button-label');
      button.disabled = isLoading;
      button.classList.toggle('is-loading', isLoading);

      if (isLoading) {
        label.innerHTML = '<span class="spinner" aria-hidden="true"></span>';
        button.setAttribute('aria-label', '送出中');
      } else if (button.dataset.state === 'done') {
        label.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        `;
        button.setAttribute('aria-label', '已完成，點擊可取消打卡');
      } else {
        label.textContent = '打卡';
        button.removeAttribute('aria-label');
      }
    }

    function markTaskDone(type) {
      const card = document.querySelector(`[data-task-card="${type}"]`);
      const button = getTaskButton(type);

      if (!card || !button) return;

      card.classList.add('is-done');
      button.dataset.state = 'done';
      button.classList.remove('is-loading');
      button.classList.add('is-done');
      button.disabled = false;
      button.setAttribute('aria-label', '已完成，點擊可取消打卡');
      button.innerHTML = `
        <span class="button-label" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
      `;
    }

    function markTaskPending(type) {
      const card = document.querySelector(`[data-task-card="${type}"]`);
      const button = getTaskButton(type);

      if (!card || !button) return;

      card.classList.remove('is-done');
      button.dataset.state = 'pending';
      button.classList.remove('is-done', 'is-loading');
      button.disabled = false;
      button.removeAttribute('aria-label');
      button.innerHTML = '<span class="button-label">打卡</span>';
    }

    function showToast(message, type) {
      window.clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.classList.toggle('error', type === 'error');
      toastEl.classList.add('show');

      toastTimer = window.setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2400);
    }

    function openSettingsOverlay(overlay) {
      activeSettingsOverlay = overlay;
      overlay.hidden = false;
      void overlay.offsetHeight;
      updateSettingsKeyboardOffset();
      overlay.classList.add('is-open');
    }

    function closeSettingsOverlay(overlay) {
      if (overlay.hidden) return;
      overlay.classList.remove('is-open');
      resetSettingsKeyboardOffset(overlay);

      if (activeSettingsOverlay === overlay) {
        activeSettingsOverlay = null;
      }

      window.setTimeout(() => {
        if (!overlay.classList.contains('is-open')) {
          overlay.hidden = true;
        }
      }, 240);
    }

    function openProfileSettings() {
      if (document.body.classList.contains('is-auth-loading')) {
        return;
      }

      if (!idToken) {
        showLoginState('請先使用 LINE 登入後開始打卡');
        return;
      }

      openSettingsOverlay(profileSettingsOverlay);
    }

    function openNicknameSheet() {
      nicknameInput.value = currentNickname;
      closeSettingsOverlay(profileSettingsOverlay);
      openSettingsOverlay(nicknameOverlay);
      nicknameInput.focus({ preventScroll: true });
      nicknameInput.select();
      requestAnimationFrame(() => {
        nicknameInput.focus({ preventScroll: true });
        updateSettingsKeyboardOffset();
      });
    }

    function getSettingsSheet(overlay) {
      return overlay ? overlay.querySelector('.settings-sheet') : null;
    }

    function resetSettingsKeyboardOffset(overlay) {
      const sheet = getSettingsSheet(overlay);
      if (!sheet) return;
      sheet.classList.remove('is-keyboard-open');
      sheet.style.removeProperty('--settings-keyboard-offset');
    }

    function updateSettingsKeyboardOffset() {
      if (!activeSettingsOverlay || activeSettingsOverlay.hidden || !window.visualViewport) {
        return;
      }

      if (activeSettingsOverlay !== nicknameOverlay) {
        return;
      }

      const sheet = getSettingsSheet(activeSettingsOverlay);
      if (!sheet) {
        return;
      }

      const viewport = window.visualViewport;
      const keyboardOffset = Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop);
      const isKeyboardOpen = keyboardOffset > 80;
      const wasKeyboardOpen = sheet.classList.contains('is-keyboard-open');

      sheet.classList.toggle('is-keyboard-open', isKeyboardOpen);

      if (isKeyboardOpen) {
        sheet.style.setProperty('--settings-keyboard-offset', `${keyboardOffset}px`);
        return;
      }

      if (wasKeyboardOpen && activeSettingsOverlay === nicknameOverlay) {
        closeSettingsOverlay(nicknameOverlay);
        return;
      }

      sheet.style.removeProperty('--settings-keyboard-offset');
    }

    function scheduleSettingsKeyboardOffsetUpdate() {
      if (settingsKeyboardUpdateFrame) {
        cancelAnimationFrame(settingsKeyboardUpdateFrame);
      }

      settingsKeyboardUpdateFrame = requestAnimationFrame(() => {
        settingsKeyboardUpdateFrame = null;
        updateSettingsKeyboardOffset();
      });
    }

    async function saveNickname() {
      if (!idToken || nicknameSaveButton.disabled) {
        return;
      }

      const nickname = nicknameInput.value.trim();

      if (!nickname) {
        showToast('請輸入暱稱', 'error');
        nicknameInput.focus();
        return;
      }

      if (nickname.length > 30) {
        showToast('暱稱最多 30 個字', 'error');
        nicknameInput.focus();
        return;
      }

      nicknameSaveButton.disabled = true;

      try {
        const response = await fetch(TEAM_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            idToken,
            action: 'updateNickname',
            nickname
          })
        });

        const data = await parseJsonResponse(response);

        if (isExpiredTokenResponse(response, data)) {
          handleAuthExpired();
          return;
        }

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Nickname update failed');
        }

        currentNickname = data.profile && data.profile.nickname
          ? data.profile.nickname
          : nickname;
        closeSettingsOverlay(nicknameOverlay);
        showToast('暱稱已更新', 'success');
      } catch (error) {
        console.error('Nickname update failed', error);
        showToast('暱稱更新失敗，請稍後再試。', 'error');
      } finally {
        nicknameSaveButton.disabled = false;
      }
    }

    function logoutLineAccount() {
      closeSettingsOverlay(profileSettingsOverlay);
      closeSettingsOverlay(nicknameOverlay);
      idToken = null;
      currentNickname = '';
      nicknameInput.value = '';
      avatarEl.src = fallbackAvatar;

      try {
        if (window.liff && liff.isLoggedIn()) {
          liff.logout();
        }
      } catch (error) {
        console.error('LINE logout failed', error);
      }

      showLoginState('請先使用 LINE 登入後開始打卡');
      showToast('已登出 LINE 帳號', 'success');
    }

    async function loadUserProfile() {
      try {
        const response = await fetch(TEAM_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            idToken,
            action: 'profile'
          })
        });

        const data = await parseJsonResponse(response);

        if (isExpiredTokenResponse(response, data)) {
          handleAuthExpired();
          return false;
        }

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Profile failed');
        }

        if (data.profile && data.profile.nickname) {
          currentNickname = data.profile.nickname;
        } else if (data.profile && data.profile.displayName) {
          currentNickname = data.profile.displayName;
        }

        return true;
      } catch (error) {
        console.error('Profile API failed', error);
        return true;
      }
    }

    async function parseJsonResponse(response) {
      const text = await response.text();

      try {
        return JSON.parse(text || '{}');
      } catch (error) {
        return {
          success: false,
          error: text || 'Invalid API response'
        };
      }
    }

    function showAuthLoading() {
      document.body.classList.add('is-auth-loading');
      authScreenEl.hidden = false;
      authScreenEl.classList.add('is-loading');
      appShellEl.hidden = false;
      tabBarEl.hidden = false;
      authDescEl.textContent = '正在初始化 LINE 登入...';
      authSpinnerEl.hidden = false;
      lineLoginButton.hidden = true;
    }

    function showLoginState(message = '請先使用 LINE 登入後開始打卡') {
      document.body.classList.remove('is-auth-loading');
      authScreenEl.hidden = false;
      authScreenEl.classList.remove('is-loading');
      appShellEl.hidden = true;
      tabBarEl.hidden = true;
      authDescEl.textContent = message;
      authSpinnerEl.hidden = true;
      lineLoginButton.hidden = false;
    }

    function showAppState() {
      document.body.classList.remove('is-auth-loading');
      authScreenEl.hidden = true;
      authScreenEl.classList.remove('is-loading');
      appShellEl.hidden = false;
      tabBarEl.hidden = false;
    }

    function isExpiredTokenResponse(response, data) {
      return response.status === 401
        && (
          data.code === 'ID_TOKEN_EXPIRED'
          || /idtoken expired|id token expired|expired/i.test(data.error || '')
        );
    }

    function isDecodedIdTokenExpired(decodedToken) {
      if (!decodedToken || !decodedToken.exp) {
        return true;
      }

      const expiresAtMs = Number(decodedToken.exp) * 1000;
      const refreshBufferMs = 30 * 1000;
      return !Number.isFinite(expiresAtMs) || expiresAtMs <= Date.now() + refreshBufferMs;
    }

    function getValidIdToken() {
      const token = liff.getIDToken();
      const decodedToken = liff.getDecodedIDToken();

      if (!token || isDecodedIdTokenExpired(decodedToken)) {
        return null;
      }

      return token;
    }

    function handleAuthExpired() {
      idToken = null;

      try {
        if (window.liff && liff.isLoggedIn()) {
          liff.logout();
        }
      } catch (error) {
        console.error('LIFF logout failed', error);
      }

      showLoginState('請先使用 LINE 登入後開始打卡');
    }

    function renderCurrentDates() {
      const today = getTaipeiToday();
      const weekStart = addDays(today, -((today.getDay() + 6) % 7));
      const weekEnd = addDays(weekStart, 6);
      const taskWeekStart = addDays(today, -today.getDay());
      const taskWeekEnd = addDays(taskWeekStart, 6);

      currentMonthEl.textContent = `${today.getMonth() + 1}月`;
      weekSelectorEl.innerHTML = '';
      syncVisibleTaskCards(getVisibleTaskTypes(today));

      for (let index = 0; index < 7; index += 1) {
        const date = addDays(weekStart, index);
        const dayEl = document.createElement('div');
        dayEl.className = 'day';

        if (isSameDate(date, today)) {
          dayEl.classList.add('selected');
          dayEl.setAttribute('aria-current', 'date');
        } else if (date < today) {
          dayEl.classList.add('outline');
        }

        dayEl.innerHTML = `
          <div class="weekday">${formatWeekdayEn(date)}</div>
          <div class="date">${date.getDate()}</div>
        `;

        weekSelectorEl.appendChild(dayEl);
      }

      document.querySelectorAll('[data-date-label="today"]').forEach(el => {
        el.textContent = formatMonthDayWithWeekday(today);
      });

      document.querySelectorAll('[data-date-label="week"]').forEach(el => {
        el.textContent = `${formatMonthDayWithWeekday(taskWeekStart)} - ${formatMonthDayWithWeekday(taskWeekEnd)}`;
      });

      document.querySelectorAll('[data-date-label="month"]').forEach(el => {
        el.textContent = `${today.getMonth() + 1}月`;
      });
    }

    function getVisibleTaskTypes(date) {
      const tasks = ['smallGroup', 'sunday', 'tithe'];
      const dayOfWeek = date.getDay();

      if (dayOfWeek >= 2 && dayOfWeek <= 6) {
        tasks.unshift('morningPrayer');
      }

      return tasks;
    }

    function getTaipeiToday() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Taipei',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(new Date());

      const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
      return new Date(Number(values.year), Number(values.month) - 1, Number(values.day));
    }

    function addDays(date, days) {
      const next = new Date(date);
      next.setDate(next.getDate() + days);
      return next;
    }

    function isSameDate(a, b) {
      return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
    }

    function formatWeekdayEn(date) {
      return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][date.getDay()];
    }

    function formatWeekdayZh(date) {
      return ['日', '一', '二', '三', '四', '五', '六'][date.getDay()];
    }

    function formatMonthDayWithWeekday(date) {
      return `${date.getMonth() + 1}/${date.getDate()}（${formatWeekdayZh(date)}）`;
    }

    function getLiffRedirectUri() {
      const url = new URL(window.location.href);
      ['code', 'state', 'liff.state', 'liff.referrer'].forEach(param => {
        url.searchParams.delete(param);
      });
      return url.toString();
    }

    function startLineLogin() {
      if (!window.liff) {
        showLoginState('LINE 登入初始化失敗，請重新整理後再試。');
        return;
      }

      liff.login({ redirectUri: getLiffRedirectUri() });
    }

    async function loadLiffAvatar() {
      if (!window.liff) {
        showLoginState('LINE 登入初始化失敗，請重新整理後再試。');
        return;
      }

      try {
        showAuthLoading();
        await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: false });

        if (!liff.isLoggedIn()) {
          showLoginState('請先使用 LINE 登入後開始打卡');
          return;
        }

        const profile = await liff.getProfile();
        idToken = getValidIdToken();

        if (!idToken) {
          handleAuthExpired();
          return;
        }

        if (profile.pictureUrl) {
          avatarEl.src = profile.pictureUrl;
        }

        currentNickname = profile.displayName || '';
        const profileLoaded = await loadUserProfile();

        if (!profileLoaded) {
          return;
        }

        showAppState();
        await loadTaskStatus();
      } catch (error) {
        console.error('LIFF initialization failed', error);
        avatarEl.src = fallbackAvatar;
        showLoginState('LINE 登入初始化失敗，請重新整理後再試。');
      }
    }

    loadLiffAvatar();
  </script>
</body>
