<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>全部任務</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --page-bg: #fffdf8;
      --card: #ffffff;
      --ink: #25211c;
      --muted: #807363;
      --line: #f6ddb2;
      --primary: #ff9f1c;
      --primary-strong: #f18a00;
      --success: #ffad2e;
      --success-soft: #fffdf8;
      --shadow: 0 10px 28px rgba(185, 117, 32, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--page-bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 10% 14%, rgba(255, 225, 166, 0.32), transparent 34%),
        radial-gradient(circle at 90% 5%, rgba(255, 243, 205, 0.28), transparent 30%),
        linear-gradient(180deg, #fffaf0 0%, #fffdf8 42%, #ffffff 100%);
    }

    button {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .app-shell {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      gap: 10px;
      align-items: center;
      min-height: 64px;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      background: rgba(255, 255, 253, 0.84);
      border-bottom: 1px solid rgba(246, 221, 178, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #4e3d2b;
      background: transparent;
      cursor: pointer;
    }

    .icon-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
    }

    .content {
      padding: 18px 20px 0;
    }

    .month-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      justify-self: center;
      min-width: 128px;
      min-height: 40px;
      padding: 0 6px;
      border: 1px solid rgba(255, 159, 28, 0.12);
      border-radius: 999px;
      color: #4e3d2b;
      background: rgba(255, 255, 253, 0.84);
      font-size: 16px;
      font-weight: 760;
      white-space: nowrap;
    }

    .month-step {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .month-step:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .month-step svg {
      width: 18px;
      height: 18px;
    }

    .month-text {
      min-width: 44px;
      text-align: center;
    }

    .filter-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 18px;
    }

    .filter-chip {
      display: grid;
      justify-items: center;
      gap: 6px;
      min-height: 74px;
      padding: 10px 6px;
      border: 1px solid transparent;
      border-radius: 16px;
      color: #756553;
      background: rgba(255, 255, 253, 0.58);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.14s ease, box-shadow 0.14s ease, transform 0.14s ease;
    }

    .filter-chip:active {
      transform: scale(0.98);
    }

    .filter-chip.is-active {
      border-color: rgba(255, 159, 28, 0.7);
      box-shadow: 0 4px 10px rgba(255, 159, 28, 0.07);
      color: #25211c;
      background: #ffffff;
    }

    .filter-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      overflow: hidden;
      background: transparent;
    }

    .filter-icon img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .task-list {
      display: grid;
      gap: 12px;
    }

    .task-card {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      min-height: 108px;
      padding: 16px;
      border: 1px solid rgba(246, 221, 178, 0.44);
      border-radius: 18px;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .task-card.is-done {
      border-color: rgba(255, 173, 46, 0.22);
      background: linear-gradient(135deg, #ffffff 0%, #fffdf8 100%);
    }

    .icon-tile {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 10px;
      overflow: hidden;
      flex: 0 0 auto;
      background: transparent;
    }

    .icon-tile img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .task-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .task-copy {
      min-width: 0;
    }

    .task-date {
      margin-bottom: 5px;
      color: #8d7a61;
      font-size: 13.5px;
      font-weight: 650;
      line-height: 1.25;
    }

    .task-name {
      margin-bottom: 5px;
      color: #25211c;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.2;
    }

    .task-note {
      color: var(--muted);
      font-size: 14px;
      font-weight: 560;
      line-height: 1.35;
    }

    .checkin-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 86px;
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      color: #ffffff;
      background: linear-gradient(135deg, #ffa927, #f29a12);
      box-shadow: 0 9px 18px rgba(242, 154, 18, 0.26);
      font-size: 16px;
      font-weight: 760;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.14s ease, opacity 0.14s ease, box-shadow 0.14s ease;
    }

    .button-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .checkin-button:active {
      transform: scale(0.97);
    }

    .checkin-button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
      transform: none;
      box-shadow: none;
    }

    .checkin-button.is-loading {
      min-width: 44px;
      padding: 0 10px;
      background: transparent;
      box-shadow: none;
      cursor: wait;
    }

    .checkin-button.is-loading:disabled {
      opacity: 1;
    }

    .checkin-button.is-loading .spinner {
      width: 22px;
      height: 22px;
      border-color: rgba(255, 159, 28, 0.18);
      border-top-color: #ff9f1c;
    }

    .done-pill {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1.5px solid rgba(255, 173, 46, 0.42);
      border-radius: 50%;
      color: #f29200;
      background: rgba(255, 255, 253, 0.9);
      flex: 0 0 auto;
    }

    .missed-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 90px;
      padding: 0 12px;
      border: 1px solid rgba(128, 115, 99, 0.18);
      border-radius: 999px;
      color: #9a8b78;
      background: rgba(255, 255, 253, 0.84);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .done-pill svg,
    .checkin-button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 254, 249, 0.45);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .list-loading {
      display: grid;
      place-items: center;
      min-height: 160px;
      padding: 48px 16px;
    }

    .page-spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255, 159, 28, 0.18);
      border-top-color: #ff9f1c;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .empty-state {
      padding: 36px 16px;
      border: 1px dashed rgba(128, 115, 99, 0.24);
      border-radius: 18px;
      color: var(--muted);
      background: rgba(255, 254, 249, 0.56);
      text-align: center;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.6;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 20;
      width: min(calc(100% - 40px), 420px);
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 16px;
      color: #ffffff;
      background: rgba(30, 140, 86, 0.94);
      box-shadow: 0 16px 36px rgba(30, 140, 86, 0.24);
      font-size: 14px;
      font-weight: 650;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 18px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.neutral {
      background: rgba(69, 51, 32, 0.92);
      box-shadow: 0 16px 36px rgba(69, 51, 32, 0.24);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast.error {
      background: rgba(190, 67, 83, 0.94);
      box-shadow: 0 16px 36px rgba(190, 67, 83, 0.22);
    }

    .toast svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 374px) {
      .content,
      .app-header {
        padding-left: 16px;
        padding-right: 16px;
      }

      .filter-row {
        gap: 6px;
      }

      .filter-chip {
        min-height: 68px;
        font-size: 12px;
      }

      .task-card {
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 12px;
        padding: 14px;
      }

      .icon-tile {
        width: 44px;
        height: 44px;
      }

      .task-main {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .checkin-button,
      .missed-pill {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <header class="app-header">
      <button class="icon-button" type="button" id="backButton" aria-label="返回首頁">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m15 6-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div class="month-pill" id="monthLabel" aria-label="月份切換">
        <button class="month-step" type="button" id="prevMonthButton" aria-label="上一個月">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m15 6-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <span class="month-text" id="currentMonthText">--月</span>
        <button class="month-step" type="button" id="nextMonthButton" aria-label="下一個月">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <span aria-hidden="true"></span>
    </header>

    <div class="content">
      <div class="filter-row" id="filterRow">
        <button class="filter-chip is-active" type="button" data-type="morningPrayer">
          <span class="filter-icon" aria-hidden="true">
            <img src="assets/five-blessings-icons/morning_prayer.png" alt="" />
          </span>
          <span>晨禱</span>
        </button>

        <button class="filter-chip" type="button" data-type="smallGroup">
          <span class="filter-icon" aria-hidden="true">
            <img src="assets/five-blessings-icons/small_group.png" alt="" />
          </span>
          <span>小家</span>
        </button>

        <button class="filter-chip" type="button" data-type="sunday">
          <span class="filter-icon" aria-hidden="true">
            <img src="assets/five-blessings-icons/sunday.png" alt="" />
          </span>
          <span>主日</span>
        </button>

        <button class="filter-chip" type="button" data-type="tithe">
          <span class="filter-icon" aria-hidden="true">
            <img src="assets/five-blessings-icons/tithe.png" alt="" />
          </span>
          <span>十一奉獻</span>
        </button>
      </div>

      <div class="task-list" id="taskList"></div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    const LIFF_ID = '2010462217-tVZRATTG';
    const CHECKIN_API_URL = '/api/checkin';
    const HISTORY_API_URL = '/api/history';
    const EARLIEST_YEAR = 2026;
    const EARLIEST_MONTH = 6;

    const taskLabels = {
      morningPrayer: '晨禱',
      smallGroup: '小家',
      sunday: '主日',
      tithe: '十一奉獻'
    };

    function getTaskDisplayLabel(type, periodKey) {
      const label = taskLabels[type] || '任務';

      if (type !== 'smallGroup' && type !== 'sunday') {
        return label;
      }

      const match = String(periodKey || '').match(/#([1-9]\d*)$/);
      return match ? `${label}${match[1]}` : label;
    }

    const taskIconSrc = {
      morningPrayer: 'assets/five-blessings-icons/morning_prayer.png',
      smallGroup: 'assets/five-blessings-icons/small_group.png',
      sunday: 'assets/five-blessings-icons/sunday.png',
      tithe: 'assets/five-blessings-icons/tithe.png'
    };

    let toastTimer = null;
    let idToken = null;
    let selectedType = 'morningPrayer';
    let selectedYear = 0;
    let selectedMonth = 0;
    let isLoading = false;

    const toastEl = document.getElementById('toast');
    const taskListEl = document.getElementById('taskList');
    const currentMonthTextEl = document.getElementById('currentMonthText');
    const prevMonthButton = document.getElementById('prevMonthButton');
    const nextMonthButton = document.getElementById('nextMonthButton');
    const backButton = document.getElementById('backButton');
    const filterButtons = Array.from(document.querySelectorAll('.filter-chip'));

    const today = getTaipeiToday();
    selectedYear = today.getFullYear();
    selectedMonth = today.getMonth() + 1;

    backButton.addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    prevMonthButton.addEventListener('click', () => {
      shiftMonth(-1);
    });

    nextMonthButton.addEventListener('click', () => {
      shiftMonth(1);
    });

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        selectedType = button.dataset.type;
        filterButtons.forEach(chip => {
          chip.classList.toggle('is-active', chip.dataset.type === selectedType);
        });
        loadHistory();
      });
    });

    function shiftMonth(delta) {
      const next = new Date(selectedYear, selectedMonth - 1 + delta, 1);
      selectedYear = next.getFullYear();
      selectedMonth = next.getMonth() + 1;
      updateMonthControls();
      loadHistory();
    }

    function compareYearMonth(year, month, compareYear, compareMonth) {
      return (year - compareYear) * 12 + (month - compareMonth);
    }

    function updateMonthControls() {
      currentMonthTextEl.textContent = `${selectedMonth}月`;

      const atEarliest = compareYearMonth(
        selectedYear,
        selectedMonth,
        EARLIEST_YEAR,
        EARLIEST_MONTH
      ) <= 0;
      const atLatest = selectedYear === today.getFullYear()
        && selectedMonth === today.getMonth() + 1;

      prevMonthButton.disabled = atEarliest;
      nextMonthButton.disabled = atLatest;
    }

    function showListLoading() {
      taskListEl.innerHTML = `
        <div class="list-loading" aria-label="載入中">
          <span class="page-spinner" aria-hidden="true"></span>
        </div>
      `;
    }

    async function loadHistory() {
      if (!idToken) {
        return;
      }

      isLoading = true;
      showListLoading();

      try {
        const response = await fetch(HISTORY_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            idToken,
            year: selectedYear,
            month: selectedMonth,
            blessingType: selectedType
          })
        });

        const data = await parseJsonResponse(response);

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'History failed');
        }

        renderTaskList(data.items || []);
      } catch (error) {
        taskListEl.innerHTML = `
          <div class="empty-state">讀取任務紀錄失敗，請重新整理後再試一次。</div>
        `;
        showToast('讀取任務紀錄失敗，請重新整理後再試一次。', 'error');
      } finally {
        isLoading = false;
      }
    }

    function renderTaskList(items) {
      if (!items.length) {
        taskListEl.innerHTML = `
          <div class="empty-state">這個月份目前沒有可查看的${taskLabels[selectedType]}任務。</div>
        `;
        return;
      }

      taskListEl.innerHTML = items.map(item => {
        const label = getTaskDisplayLabel(item.blessingType, item.periodKey);
        const actionHtml = buildActionHtml(item);
        const iconSrc = taskIconSrc[item.blessingType];

        return `
          <article class="task-card${item.completed ? ' is-done' : ''}" data-period-key="${item.periodKey}">
            <div class="icon-tile" aria-hidden="true">
              <img src="${iconSrc}" alt="" />
            </div>
            <div class="task-main">
              <div class="task-copy">
                <div class="task-date">${item.dateLabel}</div>
                <div class="task-name">${label}</div>
                <div class="task-note">${item.note}</div>
              </div>
              ${actionHtml}
            </div>
          </article>
        `;
      }).join('');

      taskListEl.querySelectorAll('.checkin-button').forEach(button => {
        button.addEventListener('click', () => {
          submitCheckin(button);
        });
      });
    }

    function buildActionHtml(item) {
      if (item.completed) {
        return `
          <div class="done-pill" aria-label="已完成">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
        `;
      }

      if (item.canCheckin) {
        return `
          <button class="checkin-button" type="button" data-type="${item.blessingType}" data-period-key="${item.periodKey}">
            <span class="button-label">打卡</span>
          </button>
        `;
      }

      return `
        <div class="missed-pill" aria-label="未完成">未完成</div>
      `;
    }

    async function submitCheckin(button) {
      if (button.disabled || isLoading) {
        return;
      }

      const type = button.dataset.type;
      const label = taskLabels[type] || '任務';
      const periodKey = button.dataset.periodKey || '';

      if (!idToken) {
        showToast('尚未完成 LINE 登入，請重新開啟頁面。', 'error');
        return;
      }

      setButtonLoading(button, true);

      try {
        const response = await fetch(CHECKIN_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            idToken,
            blessingType: type,
            periodKey
          })
        });

        const data = await parseJsonResponse(response);

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Checkin failed');
        }

        showToast(`「${label}」打卡成功！`, 'success');
        await loadHistory();
      } catch (error) {
        setButtonLoading(button, false);
        showToast('打卡失敗，請重新整理後再試一次。', 'error');
      }
    }

    function setButtonLoading(button, isLoading) {
      const label = button.querySelector('.button-label');
      button.disabled = isLoading;
      button.classList.toggle('is-loading', isLoading);

      if (isLoading) {
        label.innerHTML = '<span class="spinner" aria-hidden="true"></span>';
        button.setAttribute('aria-label', '送出中');
      } else {
        label.textContent = '打卡';
        button.removeAttribute('aria-label');
      }
    }

    function showToast(message, type) {
      window.clearTimeout(toastTimer);
      toastEl.textContent = '';
      toastEl.classList.toggle('neutral', type !== 'success' && type !== 'error');
      toastEl.classList.toggle('error', type === 'error');

      if (type === 'success') {
        toastEl.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" stroke="currentColor" stroke-width="2" />
            <path d="m8 12.2 2.4 2.4L16.4 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span></span>
        `;
        toastEl.querySelector('span').textContent = message;
      } else {
        toastEl.textContent = message;
      }

      toastEl.classList.add('show');

      toastTimer = window.setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2400);
    }

    async function parseJsonResponse(response) {
      const text = await response.text();

      try {
        return JSON.parse(text || '{}');
      } catch (error) {
        return {
          success: false,
          error: text || 'Invalid API response'
        };
      }
    }

    function getTaipeiToday() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Taipei',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(new Date());

      const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
      return new Date(Number(values.year), Number(values.month) - 1, Number(values.day));
    }

    function getLiffRedirectUri() {
      const url = new URL(window.location.href);
      ['code', 'state', 'liff.state', 'liff.referrer'].forEach(param => {
        url.searchParams.delete(param);
      });
      return url.toString();
    }

    async function initLiff() {
      updateMonthControls();
      showListLoading();

      if (!window.liff) {
        taskListEl.innerHTML = `
          <div class="empty-state">無法初始化 LINE 登入，請重新開啟頁面。</div>
        `;
        return;
      }

      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: getLiffRedirectUri() });
          return;
        }

        idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error('Missing LINE idToken');
        }

        await loadHistory();
      } catch (error) {
        taskListEl.innerHTML = `
          <div class="empty-state">登入失敗，請重新開啟頁面。</div>
        `;
      }
    }

    initLiff();
  </script>
</body>
</html>
